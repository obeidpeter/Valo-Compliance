  ManualFormFit:
    type: object
    description: How a revision's form text fits the fill-in form of the template it is filed as, found by its title.
    required: [templateId, state, problems]
    properties:
      templateId: { type: [string, 'null'] }
      state: { type: string, enum: [no_template, no_form, fits, does_not_fit] }
      problems: { type: array, maxItems: 200, items: { type: string, maxLength: 400 } }
