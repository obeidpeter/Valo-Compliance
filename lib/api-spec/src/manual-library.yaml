  ManualLibraryRevision: {"type":"object","required":["itemId","version","title","kind","state","industry","id","digest","body","fileFormat","createdBy","createdAt","publishedAt","publishedBy","live","formText","formFit","purpose","needs","limits","relatedItems","aiDrafted","relatedGuides","previousRelease","reach","told"],"properties":{"itemId":{"type":"string","format":"uuid"},"version":{"type":"integer"},"title":{"type":"string"},"kind":{"type":"string","enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article"]},"state":{"type":"string","enum":["draft","published","replaced","withdrawn"]},"industry":{"type":["string","null"]},"id":{"type":"string","format":"uuid"},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"body":{"type":"string"},"fileFormat":{"type":["string","null"],"enum":["docx","pdf",null]},"createdBy":{"type":"string"},"createdAt":{"type":"string"},"publishedAt":{"type":["string","null"]},"publishedBy":{"type":["string","null"]},"live":{"anyOf":[{"type":"object","required":["version","digest"],"properties":{"version":{"type":"integer"},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}},{"type":"null"}]},"formText":{"type":["string","null"],"description":"The template's wording with its placeholders named, for its fill-in form. Staff only."},"formFit":{"anyOf":[{"$ref":"#/components/schemas/ManualFormFit"},{"type":"null"}]},"purpose":{"type":["string","null"]},"needs":{"type":["string","null"]},"limits":{"type":["string","null"]},"relatedItems":{"type":"array","items":{"type":"string","format":"uuid"}},"aiDrafted":{"type":["boolean","null"],"description":"A template's entry details (docs/architecture/library-entries.md), released with the version."},"relatedGuides":{"type":"array","description":"The related guides by their library items, as the editor sees them: the title and kind of each item's latest version, whether a version of it is released now, or nulls for an item not in the library yet.","items":{"type":"object","required":["itemId","title","kind","live"],"properties":{"itemId":{"type":"string","format":"uuid"},"title":{"type":["string","null"]},"kind":{"type":["string","null"],"enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article",null]},"live":{"type":"boolean"}}}},"previousRelease":{"type":["integer","null"],"description":"The latest earlier version of this entry that was released, or null. Releasing this version then needs a note of what changed (docs/architecture/guidance-currency.md, slice 3)."},"reach":{"description":"For a template's published edition, whom its withdrawal would tell: the workspaces that bought the template (any of its editions, under a verified order) and those that made documents from this edition, each counted once in workspaces, as its notices count them (docs/architecture/library-holds.md, slice 1). Null for a guide, which has no buyers or documents, for an entry with no published edition, and on a database without the counts.","anyOf":[{"type":"object","required":["version","workspaces","bought","documentWorkspaces","documents"],"properties":{"version":{"type":"integer"},"workspaces":{"type":"integer","minimum":0},"bought":{"type":"integer","minimum":0},"documentWorkspaces":{"type":"integer","minimum":0},"documents":{"type":"integer","minimum":0}}},{"type":"null"}]},"told":{"type":["integer","null"],"minimum":0,"description":"For a withdrawn template edition, how many workspaces its withdrawal told, from its notices. Null otherwise."}}}
  ManualLibraryDraft: {"type":"object","required":["requestId","baseVersion","title","kind","industry","body","fileMode"],"properties":{"requestId":{"type":"string","format":"uuid"},"baseVersion":{"type":"integer","minimum":0},"title":{"type":"string","minLength":1,"maxLength":140},"kind":{"type":"string","enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article"]},"industry":{"type":["string","null"]},"body":{"type":"string","maxLength":60000},"fileMode":{"type":"string","enum":["text","upload","keep"]},"upload":{"type":"object","required":["format","base64"],"properties":{"format":{"type":"string","enum":["docx","pdf"]},"base64":{"type":"string","contentEncoding":"base64","maxLength":2796204}}},"formText":{"type":["string","null"],"maxLength":60000,"description":"For a template only: its wording with its placeholders named, for its fill-in form. Omitted or null, the version has none."},"purpose":{"type":["string","null"],"maxLength":400,"description":"For a template only: what it is for, shown on its page and as its summary in the library."},"needs":{"type":["string","null"],"maxLength":1600,"description":"For a template only: what a customer needs to complete it, one item to a line, up to 12 lines of up to 120 characters."},"limits":{"type":["string","null"],"maxLength":800,"description":"For a template only: what it does not do, shown as its limits."},"relatedItems":{"type":"array","maxItems":6,"uniqueItems":true,"items":{"type":"string","format":"uuid"},"description":"For a template only: the library items of its related guides. A guide is shown on the page only while it is released."},"aiDrafted":{"type":["boolean","null"],"description":"For a template only: whether AI drafted its text. The page's statement of how it was written follows it."}}}
