# Staff editorial drafts and released template downloads.
paths:
  /admin/owner-guidance:
    get:
      operationId: listOwnerGuidance
      tags: [staff]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: Regulatory drafts and their latest source checks, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidancePage' } } } }
        '403': { description: Recently verified development owner required }
  /admin/owner-guidance/{id}/source-check:
    post:
      operationId: refreshOwnerGuidance
      tags: [staff]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceRevision' } } }
      responses:
        '200': { description: Official source check recorded, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceCheck' } } } }
        '403': { description: Recently verified development owner required }
        '409': { description: No matching registered article }
  /admin/owner-guidance/{id}/decisions:
    post:
      operationId: decideOwnerGuidance
      tags: [staff]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceDecision' } } }
      responses:
        '200': { description: Confirmed regulatory revision, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceReceipt' } } } }
        '403': { description: Recently verified development owner required }
        '409': { description: The revision or source evidence changed }
  /admin/manual-library: {"get":{"operationId":"listManualLibrary","tags":["staff"],"parameters":[{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","required":false,"schema":{"type":"string","maxLength":140}},{"name":"kind","in":"query","required":false,"schema":{"type":"string","enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article"]}},{"name":"state","in":"query","required":false,"schema":{"type":"string","enum":["draft","published","replaced","withdrawn"]}},{"name":"industry","in":"query","required":false,"schema":{"type":"string","maxLength":80}}],"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryPage"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/retained:
    get:
      operationId: listRetainedDrafts
      tags: [staff]
      responses:
        '200': { description: 'Each draft kept in the repository and where it stands in the library', content: { application/json: { schema: { $ref: '#/components/schemas/RetainedDraftStatus' } } } }
        '403': { description: Recently verified content staff required }
    post:
      operationId: loadRetainedDrafts
      tags: [staff]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RetainedDraftLoad' } } }
      responses:
        '200': { description: 'The next drafts that were not in the library, or the next templates without their proposed form text or entry details, filed as private drafts. Nothing is published.', content: { application/json: { schema: { $ref: '#/components/schemas/RetainedDraftLoadResult' } } } }
        '403': { description: Recently verified content staff required }
  /admin/manual-library/{id}: {"get":{"operationId":"getManualLibraryRevision","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryRevision"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}/drafts: {"post":{"operationId":"saveManualLibraryDraft","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/vnd.valo.manual-draft+json":{"schema":{"$ref":"#/components/schemas/ManualLibraryDraft"}}}},"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryRevision"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}/actions: {"post":{"operationId":"actOnManualLibrary","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryAction"}}}},"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryRevision"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}/revisions/{version}/file: {"get":{"operationId":"previewManualLibraryFile","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"version","in":"path","required":true,"schema":{"type":"integer"}}],"responses":{"200":{"description":"Authorized template file","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /account/manual-templates/{id}/download: {"get":{"operationId":"downloadManualTemplate","tags":["catalogue"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Authorized template file","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /workspace/manual-premium-templates/{id}/download: {"get":{"operationId":"downloadPremiumManualTemplate","tags":["catalogue"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Workspace purchase for this published premium edition","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
schemas:
  OwnerGuidanceRevision:
    type: object
    required: [version, digest]
    properties:
      version: { type: integer, minimum: 1 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
  OwnerGuidanceCheck:
    type: object
    required: [id, sources, holds]
    properties:
      id: { type: string }
      sources: { type: integer, minimum: 0 }
      holds: { type: array, items: { type: string } }
  OwnerGuidancePage:
    type: object
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/components/schemas/OwnerGuidanceItem' } }
      hasMore: { type: boolean }
  OwnerGuidanceItem:
    type: object
    required: [itemId, version, digest, title, body, state, checkId, checkedAt, holds, sources, live]
    properties:
      itemId: { type: string, format: uuid }
      version: { type: integer }
      digest: { type: string }
      title: { type: string }
      body: { type: string }
      state: { type: string, enum: [draft, published, withdrawn, replaced] }
      checkId: { type: [string, 'null'] }
      checkedAt: { type: [string, 'null'] }
      holds: { type: array, items: { type: string } }
      sources: { type: array, items: { $ref: '#/components/schemas/PublicSourceReference' } }
      live:
        anyOf:
          - type: object
            required: [version, digest]
            properties: { version: {type: integer}, digest: {type: string} }
          - {type: 'null'}
  OwnerGuidanceDecision:
    type: object
    required: [action, version, digest, checkId, confirmed]
    properties:
      action: { type: string, enum: [publish, withdraw] }
      version: { type: integer, minimum: 1 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      checkId: { anyOf: [{type: string, format: uuid}, {type: 'null'}] }
      confirmed: { type: boolean, enum: [true] }
  OwnerGuidanceReceipt:
    type: object
    required: [itemId, version, state]
    properties:
      itemId: {type: string, format: uuid}
      version: {type: integer}
      state: {type: string, enum: [published, withdrawn]}
  RetainedDraftLoad:
    type: object
    required: [load]
    properties:
      load: { type: string, enum: [missing, form_text, details], description: "missing files the drafts not in the library yet; form_text files a new draft version of each filed template whose latest version lacks the form text proposed for it; details files a new draft version of each filed template whose latest version lacks its entry details, with the details proposed for it" }
  RetainedDraftSourceCheck:
    type: object
    required: [checkedAt, holds, validThrough]
    properties:
      checkedAt: { type: string, format: date-time }
      holds: { type: integer, minimum: 0 }
      validThrough: { type: [string, 'null'], format: date-time }
  RetainedDraft:
    type: object
    required: [retainedId, kind, title, industry, itemId, state, version, liveVersion, shown, sourceCheck, formText, details]
    properties:
      retainedId: { type: string }
      kind: { type: string, enum: [practical_guide, industry_introduction, industry_pack, template, premium_template, regulatory_article] }
      title: { type: string }
      industry: { type: [string, 'null'] }
      itemId: { type: [string, 'null'], format: uuid }
      state: { type: string, enum: [not_in_library, draft, published, withdrawn, replaced] }
      version: { type: [integer, 'null'] }
      liveVersion: { type: [integer, 'null'] }
      shown: { type: boolean }
      formText: { type: [string, 'null'], enum: [proposed, filed, null], description: "For a template with a fill-in form: whether the library's latest version carries the form text proposed for it (filed) or not yet (proposed). Null for every other draft." }
      details: { type: [string, 'null'], enum: [proposed, filed, null], description: "For a template: whether the library's latest version says what it is for, its limits and how it was written (filed), or not yet, so that its proposed details wait to be filed (proposed). Null for every other draft." }
      sourceCheck:
        anyOf:
          - { $ref: '#/components/schemas/RetainedDraftSourceCheck' }
          - { type: 'null' }
  RetainedDraftStatus:
    type: object
    required: [items, notInLibrary, published, shown]
    properties:
      items: { type: array, items: { $ref: '#/components/schemas/RetainedDraft' } }
      notInLibrary: { type: integer, minimum: 0 }
      published: { type: integer, minimum: 0 }
      shown: { type: integer, minimum: 0 }
  RetainedDraftLoadResult:
    type: object
    required: [loaded, remaining, status]
    properties:
      loaded: { type: array, items: { type: string } }
      remaining: { type: integer, minimum: 0 }
      status: { $ref: '#/components/schemas/RetainedDraftStatus' }
  ManualLibraryEntry: {"type":"object","required":["itemId","version","title","kind","state","industry"],"properties":{"itemId":{"type":"string","format":"uuid"},"version":{"type":"integer"},"title":{"type":"string"},"kind":{"type":"string","enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article"]},"state":{"type":"string","enum":["draft","published","replaced","withdrawn"]},"industry":{"type":["string","null"]}}}
  ManualLibraryPage: {"type":"object","required":["items","hasMore"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ManualLibraryEntry"}},"hasMore":{"type":"boolean"}}}
  ManualLibraryRevision: {"type":"object","required":["itemId","version","title","kind","state","industry","id","digest","body","fileFormat","createdBy","createdAt","publishedAt","publishedBy","live","formText","formFit","purpose","needs","limits","relatedItems","aiDrafted","relatedGuides"],"properties":{"itemId":{"type":"string","format":"uuid"},"version":{"type":"integer"},"title":{"type":"string"},"kind":{"type":"string","enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article"]},"state":{"type":"string","enum":["draft","published","replaced","withdrawn"]},"industry":{"type":["string","null"]},"id":{"type":"string","format":"uuid"},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"body":{"type":"string"},"fileFormat":{"type":["string","null"],"enum":["docx","pdf",null]},"createdBy":{"type":"string"},"createdAt":{"type":"string"},"publishedAt":{"type":["string","null"]},"publishedBy":{"type":["string","null"]},"live":{"anyOf":[{"type":"object","required":["version","digest"],"properties":{"version":{"type":"integer"},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}},{"type":"null"}]},"formText":{"type":["string","null"],"description":"The template's wording with its placeholders named, for its fill-in form. Staff only."},"formFit":{"anyOf":[{"$ref":"#/components/schemas/ManualFormFit"},{"type":"null"}]},"purpose":{"type":["string","null"]},"needs":{"type":["string","null"]},"limits":{"type":["string","null"]},"relatedItems":{"type":"array","items":{"type":"string","format":"uuid"}},"aiDrafted":{"type":["boolean","null"],"description":"A template's entry details (docs/architecture/library-entries.md), released with the version."},"relatedGuides":{"type":"array","description":"The related guides by their library items, as the editor sees them: the title and kind of each item's latest version, whether a version of it is released now, or nulls for an item not in the library yet.","items":{"type":"object","required":["itemId","title","kind","live"],"properties":{"itemId":{"type":"string","format":"uuid"},"title":{"type":["string","null"]},"kind":{"type":["string","null"],"enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article",null]},"live":{"type":"boolean"}}}}}}
  ManualLibraryDraft: {"type":"object","required":["requestId","baseVersion","title","kind","industry","body","fileMode"],"properties":{"requestId":{"type":"string","format":"uuid"},"baseVersion":{"type":"integer","minimum":0},"title":{"type":"string","minLength":1,"maxLength":140},"kind":{"type":"string","enum":["practical_guide","industry_introduction","industry_pack","template","premium_template","regulatory_article"]},"industry":{"type":["string","null"]},"body":{"type":"string","maxLength":60000},"fileMode":{"type":"string","enum":["text","upload","keep"]},"upload":{"type":"object","required":["format","base64"],"properties":{"format":{"type":"string","enum":["docx","pdf"]},"base64":{"type":"string","contentEncoding":"base64","maxLength":2796204}}},"formText":{"type":["string","null"],"maxLength":60000,"description":"For a template only: its wording with its placeholders named, for its fill-in form. Omitted or null, the version has none."},"purpose":{"type":["string","null"],"maxLength":400,"description":"For a template only: what it is for, shown on its page and as its summary in the library."},"needs":{"type":["string","null"],"maxLength":1600,"description":"For a template only: what a customer needs to complete it, one item to a line, up to 12 lines of up to 120 characters."},"limits":{"type":["string","null"],"maxLength":800,"description":"For a template only: what it does not do, shown as its limits."},"relatedItems":{"type":"array","maxItems":6,"uniqueItems":true,"items":{"type":"string","format":"uuid"},"description":"For a template only: the library items of its related guides. A guide is shown on the page only while it is released."},"aiDrafted":{"type":["boolean","null"],"description":"For a template only: whether AI drafted its text. The page's statement of how it was written follows it."}}}
  ManualLibraryAction: {"type":"object","required":["action","version","digest"],"properties":{"action":{"type":"string","enum":["publish","withdraw"]},"version":{"type":"integer","minimum":1},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}
  ManualFormFit:
    type: object
    description: How a revision's form text fits the fill-in form of the template it is filed as, found by its title.
    required: [templateId, state, problems]
    properties:
      templateId: { type: [string, 'null'] }
      state: { type: string, enum: [no_template, no_form, fits, does_not_fit] }
      problems: { type: array, maxItems: 200, items: { type: string, maxLength: 400 } }
