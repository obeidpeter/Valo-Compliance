# Staff editorial drafts and released template downloads.
paths:
  /admin/owner-guidance:
    get:
      operationId: listOwnerGuidance
      tags: [staff]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        '200': { description: Regulatory drafts and their latest source checks, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidancePage' } } } }
        '403': { description: Recently verified development owner required }
  /admin/owner-guidance/{id}/source-check:
    post:
      operationId: refreshOwnerGuidance
      tags: [staff]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceRevision' } } }
      responses:
        '200': { description: Official source check recorded, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceCheck' } } } }
        '403': { description: Recently verified development owner required }
        '409': { description: No matching registered article }
  /admin/owner-guidance/{id}/decisions:
    post:
      operationId: decideOwnerGuidance
      tags: [staff]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceDecision' } } }
      responses:
        '200': { description: Confirmed regulatory revision, content: { application/json: { schema: { $ref: '#/components/schemas/OwnerGuidanceReceipt' } } } }
        '403': { description: Recently verified development owner required }
        '409': { description: The revision or source evidence changed }
  /admin/manual-library: {"get":{"operationId":"listManualLibrary","tags":["staff"],"parameters":[{"name":"page","in":"query","required":false,"schema":{"type":"integer","minimum":1,"default":1}},{"name":"q","in":"query","required":false,"schema":{"type":"string","maxLength":140}},{"name":"kind","in":"query","required":false,"schema":{"type":"string","enum":["practical_guide","industry_introduction","template","premium_template","regulatory_article"]}},{"name":"state","in":"query","required":false,"schema":{"type":"string","enum":["draft","published","replaced","withdrawn"]}},{"name":"industry","in":"query","required":false,"schema":{"type":"string","maxLength":80}}],"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryPage"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}: {"get":{"operationId":"getManualLibraryRevision","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryRevision"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}/drafts: {"post":{"operationId":"saveManualLibraryDraft","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/vnd.valo.manual-draft+json":{"schema":{"$ref":"#/components/schemas/ManualLibraryDraft"}}}},"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryRevision"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}/actions: {"post":{"operationId":"actOnManualLibrary","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryAction"}}}},"responses":{"200":{"description":"Current editorial record","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ManualLibraryRevision"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /admin/manual-library/{id}/revisions/{version}/file: {"get":{"operationId":"previewManualLibraryFile","tags":["staff"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}},{"name":"version","in":"path","required":true,"schema":{"type":"integer"}}],"responses":{"200":{"description":"Authorized template file","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /account/manual-templates/{id}/download: {"get":{"operationId":"downloadManualTemplate","tags":["catalogue"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Authorized template file","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
  /workspace/manual-premium-templates/{id}/download: {"get":{"operationId":"downloadPremiumManualTemplate","tags":["catalogue"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string","format":"uuid"}}],"responses":{"200":{"description":"Workspace purchase for this published premium edition","content":{"application/octet-stream":{"schema":{"type":"string","format":"binary"}}}},"401":{"description":"Sign in required"},"403":{"description":"Access denied"},"404":{"description":"Unavailable"},"409":{"description":"Revision conflict or source hold"}}}}
schemas:
  OwnerGuidanceRevision:
    type: object
    required: [version, digest]
    properties:
      version: { type: integer, minimum: 1 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
  OwnerGuidanceCheck:
    type: object
    required: [id, sources, holds]
    properties:
      id: { type: string }
      sources: { type: integer, minimum: 0 }
      holds: { type: array, items: { type: string } }
  OwnerGuidancePage:
    type: object
    required: [items, hasMore]
    properties:
      items: { type: array, items: { $ref: '#/components/schemas/OwnerGuidanceItem' } }
      hasMore: { type: boolean }
  OwnerGuidanceItem:
    type: object
    required: [itemId, version, digest, title, body, state, checkId, checkedAt, holds, sources, live]
    properties:
      itemId: { type: string, format: uuid }
      version: { type: integer }
      digest: { type: string }
      title: { type: string }
      body: { type: string }
      state: { type: string, enum: [draft, published, withdrawn, replaced] }
      checkId: { type: [string, 'null'] }
      checkedAt: { type: [string, 'null'] }
      holds: { type: array, items: { type: string } }
      sources: { type: array, items: { $ref: '#/components/schemas/PublicSourceReference' } }
      live:
        anyOf:
          - type: object
            required: [version, digest]
            properties: { version: {type: integer}, digest: {type: string} }
          - {type: 'null'}
  OwnerGuidanceDecision:
    type: object
    required: [action, version, digest, checkId, confirmed]
    properties:
      action: { type: string, enum: [publish, withdraw] }
      version: { type: integer, minimum: 1 }
      digest: { type: string, pattern: '^[a-f0-9]{64}$' }
      checkId: { anyOf: [{type: string, format: uuid}, {type: 'null'}] }
      confirmed: { type: boolean, enum: [true] }
  OwnerGuidanceReceipt:
    type: object
    required: [itemId, version, state]
    properties:
      itemId: {type: string, format: uuid}
      version: {type: integer}
      state: {type: string, enum: [published, withdrawn]}
  ManualLibraryEntry: {"type":"object","required":["itemId","version","title","kind","state","industry"],"properties":{"itemId":{"type":"string","format":"uuid"},"version":{"type":"integer"},"title":{"type":"string"},"kind":{"type":"string","enum":["practical_guide","industry_introduction","template","premium_template","regulatory_article"]},"state":{"type":"string","enum":["draft","published","replaced","withdrawn"]},"industry":{"type":["string","null"]}}}
  ManualLibraryPage: {"type":"object","required":["items","hasMore"],"properties":{"items":{"type":"array","items":{"$ref":"#/components/schemas/ManualLibraryEntry"}},"hasMore":{"type":"boolean"}}}
  ManualLibraryRevision: {"type":"object","required":["itemId","version","title","kind","state","industry","id","digest","body","fileFormat","createdBy","createdAt","publishedAt","publishedBy","live"],"properties":{"itemId":{"type":"string","format":"uuid"},"version":{"type":"integer"},"title":{"type":"string"},"kind":{"type":"string","enum":["practical_guide","industry_introduction","template","premium_template","regulatory_article"]},"state":{"type":"string","enum":["draft","published","replaced","withdrawn"]},"industry":{"type":["string","null"]},"id":{"type":"string","format":"uuid"},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"},"body":{"type":"string"},"fileFormat":{"type":["string","null"],"enum":["docx","pdf",null]},"createdBy":{"type":"string"},"createdAt":{"type":"string"},"publishedAt":{"type":["string","null"]},"publishedBy":{"type":["string","null"]},"live":{"anyOf":[{"type":"object","required":["version","digest"],"properties":{"version":{"type":"integer"},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}},{"type":"null"}]}}}
  ManualLibraryDraft: {"type":"object","required":["requestId","baseVersion","title","kind","industry","body","fileMode"],"properties":{"requestId":{"type":"string","format":"uuid"},"baseVersion":{"type":"integer","minimum":0},"title":{"type":"string","minLength":1,"maxLength":140},"kind":{"type":"string","enum":["practical_guide","industry_introduction","template","premium_template","regulatory_article"]},"industry":{"type":["string","null"]},"body":{"type":"string","maxLength":60000},"fileMode":{"type":"string","enum":["text","upload","keep"]},"upload":{"type":"object","required":["format","base64"],"properties":{"format":{"type":"string","enum":["docx","pdf"]},"base64":{"type":"string","contentEncoding":"base64","maxLength":2796204}}}}}
  ManualLibraryAction: {"type":"object","required":["action","version","digest"],"properties":{"action":{"type":"string","enum":["publish","withdraw"]},"version":{"type":"integer","minimum":1},"digest":{"type":"string","pattern":"^[0-9a-f]{64}$"}}}
