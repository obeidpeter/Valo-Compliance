# The checker and saved assessments.
paths:
  /checker/preview:
    post:
      operationId: previewAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentInput" }
      responses:
        "200":
          description: Ephemeral assessment; inputs are not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResult" }
  /checker/questions:
    get:
      operationId: listCheckerRulesInUse
      description: >-
        The released rules the requirements check would use today, under the same release checks
        as an assessment, and which of the check's rule questions each reads (RUL-001). Holds no
        customer data. Counts against the per-visitor limit on public reads.
      responses:
        "200":
          description: The rules in use, so that the page asks only their questions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckerRulesInUse" }
  /workspace/checker/preview:
    post:
      operationId: previewWorkspaceAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentInput" }
      responses:
        "200":
          description: Ephemeral assessment; inputs are not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResult" }
  /workspace/assessments:
    get:
      operationId: listAssessments
      responses:
        "200":
          description: Workspace assessment history, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SavedAssessment" } }
    post:
      operationId: createAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedAssessmentInput" }
      responses:
        "201":
          description: Immutable consented assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedAssessment" }
  /workspace/assessments/{id}:
    get:
      operationId: getAssessment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Workspace-owned assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedAssessment" }
  /workspace/assessments/{id}/compare/{previousId}:
    get:
      operationId: compareAssessments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: previousId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Comparison preserves both assessments and all tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentComparison" }
