  MissingAnswerState:
    type: object
    additionalProperties: false
    required: [field, state]
    properties:
      field: { type: string }
      state: { type: string, enum: [unknown, unanswered, not_applicable, review] }
  CheckerFacts:
    type: object
    additionalProperties: false
    required: [legalForm, registrationStatus, activities, state, lga, employees, turnoverBand, turnoverYear, turnoverMetric, turnoverCurrency, premises, manufacturing, importing, personalData]
    properties:
      factsVersion: { type: string, enum: [checker-facts-v2] }
      rich: { $ref: "#/components/schemas/RichCheckerFacts" }
      legalForm: { type: string, maxLength: 80 }
      registrationStatus: { type: string, maxLength: 80 }
      activities:
        oneOf:
          - { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 120 } }
          - { $ref: "#/components/schemas/UnknownAnswer" }
      productTypes:
        oneOf:
          - { type: array, maxItems: 10, items: { type: string, minLength: 1, maxLength: 120 } }
          - { $ref: "#/components/schemas/UnknownAnswer" }
      state:
        type: string
        enum: [unknown, unanswered, Abia, Adamawa, Akwa Ibom, Anambra, Bauchi, Bayelsa, Benue, Borno, Cross River, Delta, Ebonyi, Edo, Ekiti, Enugu, FCT, Gombe, Imo, Jigawa, Kaduna, Kano, Katsina, Kebbi, Kogi, Kwara, Lagos, Nasarawa, Niger, Ogun, Ondo, Osun, Oyo, Plateau, Rivers, Sokoto, Taraba, Yobe, Zamfara]
      lga: { type: string, maxLength: 100 }
      employees: { type: string, pattern: "^(unknown|unanswered|not_applicable|[0-9]{1,7})$" }
      turnoverBand: { type: string, enum: [under_5m, 5m_to_25m, 25m_to_100m, over_100m, unknown, unanswered, not_applicable] }
      turnoverYear: { type: string, pattern: "^(unknown|unanswered|not_applicable|[0-9]{4})$" }
      turnoverMetric: { type: string, enum: [gross_revenue, unknown, unanswered, not_applicable] }
      turnoverCurrency: { type: string, enum: [NGN, unknown, unanswered, not_applicable] }
      turnoverPeriod: { type: string, enum: [annual, monthly, quarterly, unknown, unanswered, not_applicable] }
      turnoverAmountKobo: { type: [string, "null"], pattern: "^[0-9]{1,24}$" }
      turnoverPeriodStart: { type: string, pattern: "^(unknown|unanswered|not_applicable|[0-9]{4}-[0-9]{2}-[0-9]{2})$" }
      turnoverPeriodEnd: { type: string, pattern: "^(unknown|unanswered|not_applicable|[0-9]{4}-[0-9]{2}-[0-9]{2})$" }
      premises: { $ref: "#/components/schemas/Answer" }
      manufacturing: { $ref: "#/components/schemas/Answer" }
      importing: { $ref: "#/components/schemas/Answer" }
      personalData: { $ref: "#/components/schemas/Answer" }
  UnknownAnswer:
    type: string
    enum: [unknown, unanswered, not_applicable]
  AssessmentInput:
    type: object
    additionalProperties: false
    required: [facts, asOfDate]
    properties:
      facts: { $ref: "#/components/schemas/CheckerFacts" }
      asOfDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
  SavedAssessmentInput:
    type: object
    additionalProperties: false
    required: [asOfDate, saveConsent]
    properties:
      facts: { $ref: "#/components/schemas/CheckerFacts" }
      expectedProfileRevision: { type: integer, minimum: 1 }
      asOfDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      saveConsent: { type: boolean }
  RuleSource:
    type: object
    required: [id, url, title, locator, quote, snapshotHash]
    properties:
      id: { type: string }
      url: { type: string }
      title: { type: string }
      locator: { type: string }
      quote: { type: string }
      snapshotHash: { type: string }
  RuleJurisdiction:
    type: object
    required: [level]
    properties:
      level: { type: string, enum: [federal, state, lga] }
      state: { type: string }
      lga: { type: string }
  AssessmentItem:
    type: object
    required: [ruleId, ruleVersion, requirementVersionId, title, label, reason, missingFacts, matchedFacts, nextStep, jurisdiction, sources, relatedTemplateIds]
    properties:
      ruleId: { type: string }
      ruleVersion: { type: integer }
      requirementVersionId: { type: string }
      title: { type: string }
      label: { type: string, enum: ["Likely relevant", "May apply", "More information needed", "Not indicated by these answers"] }
      reason: { type: string }
      assessedProposition: { type: string }
      factsNotice: { type: string }
      sourceReviewHold: { type: string }
      releaseNotice:
        type: string
        description: How the rule behind this item was released (EDP-008). A result saved before the notice was recorded has none.
      sourceLinkedTaskEligible: { type: boolean }
      missingAnswerStates: { type: array, items: { $ref: "#/components/schemas/MissingAnswerState" } }
      missingFacts: { type: array, items: { type: string } }
      matchedFacts: { type: array, items: { type: string } }
      nextStep: { type: string }
      jurisdiction: { $ref: "#/components/schemas/RuleJurisdiction" }
      sources: { type: array, items: { $ref: "#/components/schemas/RuleSource" } }
      relatedTemplateIds: { type: array, items: { type: string } }
      officialRoute:
        $ref: "#/components/schemas/RequirementRoute"
      figures:
        type: array
        description: Each fee, deadline, rate or threshold the item's rule records, with the source it rests on (CMP-006). Absent when the rule records none, and in a result saved before figures were recorded.
        items: { $ref: "#/components/schemas/RequirementFigure" }
  RequirementFigure:
    type: object
    required: [kind, words, sourceId]
    properties:
      kind: { type: string, enum: [fee, deadline, rate, threshold] }
      words: { type: string, description: "In the words of the passage of the item's source it rests on." }
      sourceId: { type: string, description: "The id of one of the item's sources." }
  CheckerRuleInUse:
    type: object
    required: [ruleId, ruleVersion, title, family]
    properties:
      ruleId: { type: string }
      ruleVersion: { type: integer }
      title: { type: string }
      family:
        type: [string, "null"]
        enum: [businessName, tax, privacy, product, null]
        description: The rule questions the rule reads, or null for a rule that reads only the check's own questions.
  CheckerRulesInUse:
    type: object
    required: [asOfDate, rules]
    properties:
      asOfDate: { type: string }
      rules: { type: array, items: { $ref: "#/components/schemas/CheckerRuleInUse" } }
  OfficialRoute:
    type: object
    required: [title, url]
    properties:
      title: { type: string }
      url: { type: string }
  AssessmentResult:
    type: object
    required: [schemaVersion, asOfDate, rulesetVersion, items, unanswered, gaps, recommendedTemplateIds, officialRoutes, notice, sourceBackedRecommendations, resultHash]
    properties:
      schemaVersion: { type: string }
      asOfDate: { type: string }
      rulesetVersion: { type: string }
      items: { type: array, items: { $ref: "#/components/schemas/AssessmentItem" } }
      unanswered: { type: array, items: { type: string } }
      gaps: { type: array, items: { type: string } }
      recommendedTemplateIds: { type: array, items: { type: string } }
      officialRoutes: { type: array, items: { $ref: "#/components/schemas/OfficialRoute" } }
      notice: { type: string }
      sourceBackedRecommendations: { type: integer }
      resultHash: { type: string }
  SavedAssessment:
    type: object
    required: [id, profileRevision, facts, result, createdAt]
    properties:
      id: { type: string }
      profileRevision: { type: [integer, "null"] }
      facts: { $ref: "#/components/schemas/CheckerFacts" }
      result: { $ref: "#/components/schemas/AssessmentResult" }
      createdAt: { type: string }
  AssessmentComparison:
    type: object
    required: [previousId, currentId, changedFacts, addedRuleIds, removedRuleIds, changedRuleIds, explanations]
    properties:
      previousId: { type: string }
      currentId: { type: string }
      changedFacts: { type: array, items: { type: string } }
      addedRuleIds: { type: array, items: { type: string } }
      removedRuleIds: { type: array, items: { type: string } }
      changedRuleIds: { type: array, items: { type: string } }
      explanations:
        description: Why each added, removed or changed rule differs between the two assessments (CMP-005).
        type: array
        items: { $ref: "#/components/schemas/AssessmentChange" }
  AssessmentChange:
    type: object
    required: [ruleId, title, change, previousVersion, currentVersion, previousLabel, currentLabel, changedFacts]
    properties:
      ruleId: { type: string }
      title: { type: string }
      change: { type: string, enum: [added, removed, changed] }
      previousVersion: { type: [integer, "null"] }
      currentVersion: { type: [integer, "null"] }
      previousLabel: { type: [string, "null"] }
      currentLabel: { type: [string, "null"] }
      changedFacts:
        description: The changed answers this rule's result used or still needs.
        type: array
        items: { type: string }
