# Tasks, reminders and reminder preferences.
paths:
  /workspace/tasks/page:
    get:
      operationId: listTasksPage
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { in: query, name: filter, schema: { type: string, enum: [open, done, all], default: open } }
      responses:
        "200":
          description: Tenant-scoped filtered page and actual database totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
  /workspace/tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          description: Workspace-owned tasks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkspaceTask" } }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Saved task, not a regulator acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTask" }
  /workspace/tasks/{id}:
    patch:
      operationId: updateTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Revision-safe task update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTask" }
    delete:
      operationId: deleteTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskArchiveInput" }
      responses:
        "204": { description: Task archived; reminders cancelled }
  /workspace/reminder-preferences:
    get:
      operationId: getReminderPreferences
      responses:
        "200":
          description: Current dispatch-time preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
    put:
      operationId: saveReminderPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderPreferencesInput" }
      responses:
        "200":
          description: Preference version saved independently of marketing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
  /workspace/reminders:
    get:
      operationId: listReminders
      responses:
        "200":
          description: Actual schedule and delivery status; held is not sent
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReminderRecord" } }
schemas:
  TaskState:
    type: string
    enum: [not_started, in_progress, completed_by_user, needs_review]
  TaskArchiveInput:
    type: object
    additionalProperties: false
    required: [expectedRevision]
    properties:
      expectedRevision: { type: integer, minimum: 1 }
  TaskInput:
    type: object
    additionalProperties: false
    required: [title, notes, dueDate, dateConfirmed, assessmentId, ruleId]
    properties:
      title: { type: string, minLength: 1, maxLength: 200 }
      notes: { type: string, maxLength: 6000 }
      dueDate: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      dateConfirmed: { type: boolean }
      assessmentId: { type: [string, "null"], format: uuid }
      ruleId: { type: [string, "null"], maxLength: 100 }
  TaskUpdate:
    type: object
    additionalProperties: false
    required: [title, notes, dueDate, dateConfirmed, state, expectedRevision]
    properties:
      title: { type: string, minLength: 1, maxLength: 200 }
      notes: { type: string, maxLength: 6000 }
      dueDate: { type: [string, "null"], pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
      dateConfirmed: { type: boolean }
      state: { $ref: "#/components/schemas/TaskState" }
      expectedRevision: { type: integer, minimum: 1 }
  WorkspaceTask:
    type: object
    required: [id, title, notes, state, revision, dueDate, dateConfirmed, assessmentId, ruleId, needsReview, createdAt, updatedAt]
    properties:
      id: { type: string }
      title: { type: string }
      notes: { type: string }
      state: { $ref: "#/components/schemas/TaskState" }
      revision: { type: integer }
      dueDate: { type: [string, "null"] }
      dateConfirmed: { type: boolean }
      assessmentId: { type: [string, "null"] }
      ruleId: { type: [string, "null"] }
      needsReview: { type: boolean }
      createdAt: { type: string }
      updatedAt: { type: string }
  TaskPage:
    type: object
    required: [items, total, openCount, filteredTotal, page, pageSize, hasNext]
    properties:
      items: { type: array, items: { $ref: "#/components/schemas/WorkspaceTask" } }
      total: { type: integer }
      openCount: { type: integer }
      filteredTotal: { type: integer }
      page: { type: integer }
      pageSize: { type: integer }
      hasNext: { type: boolean }
  ReminderPreferencesInput:
    type: object
    additionalProperties: false
    required: [enabled, offsets, expectedRevision]
    properties:
      enabled: { type: boolean }
      offsets: { type: array, minItems: 0, maxItems: 4, items: { type: integer, enum: [0, 1, 3, 7, 14] } }
      expectedRevision: { type: integer, minimum: 0 }
  ReminderPreferences:
    type: object
    required: [enabled, offsets, revision, timezone, deliveryAvailable, deliveryBlocker]
    properties:
      enabled: { type: boolean }
      offsets: { type: array, items: { type: integer } }
      revision: { type: integer }
      timezone: { type: string }
      deliveryAvailable: { type: boolean }
      deliveryBlocker: { type: [string, "null"] }
  ReminderRecord:
    type: object
    required: [id, taskId, scheduledAt, status, reason, deliveredAt, attempts, nextAttemptAt, lastAttemptAt]
    properties:
      id: { type: string }
      taskId: { type: string }
      scheduledAt: { type: string }
      status: { type: string, enum: [held, pending, sent, cancelled, failed] }
      attempts: { type: integer, minimum: 0 }
      nextAttemptAt: { type: string, nullable: true }
      lastAttemptAt: { type: string, nullable: true }
      reason: { type: [string, "null"] }
      deliveredAt: { type: [string, "null"] }
