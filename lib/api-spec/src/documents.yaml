# Business documents and their revisions.
paths:
  /workspace/documents:
    get:
      operationId: listDocuments
      responses:
        "200":
          description: Private business drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Saved manual business draft, not a published template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/documents/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDocument
      responses:
        "200":
          description: Latest canonical saved revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
    patch:
      operationId: saveDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Newly appended immutable revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/document-editions:
    get:
      operationId: listDocumentEditions
      description: "The workspace's documents whose template edition was replaced by a later release or withdrawn, with where it stands now (docs/architecture/editions.md). A document made from no template, or from its template's current edition, is not listed. The documents themselves never change."
      responses:
        "200":
          description: The documents whose template edition was replaced or withdrawn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentEditions" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/edition-notices:
    get:
      operationId: listEditionNotices
      description: "The workspace's unread notices that a template edition it bought or used was replaced by a later release or withdrawn, newest first, up to 50 (docs/architecture/editions.md). The database writes each one with the change."
      responses:
        "200":
          description: The workspace's notices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditionNotices" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/edition-notices/{id}/read:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: markEditionNoticeRead
      description: "Marks one of the workspace's notices read, so that its home no longer lists it. Nothing else of it changes."
      responses:
        "200":
          description: The workspace's unread notices, without this one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditionNotices" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/form-templates:
    get:
      operationId: listFormTemplates
      description: "The templates whose form (forms v2) a workspace can start now: each free template with a released edition of its wording that its form fits, and each premium template whose edition the workspace bought has such wording. A template not listed starts with its questions only, and a premium template the workspace holds no live edition of is listed as needing a purchase first."
      responses:
        "200":
          description: The templates whose form can be started, with the version of the edition each starts from
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FormTemplates" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /workspace/form-documents:
    post:
      operationId: startFormDocument
      description: "Starts a document from a template's form (forms v2): from the most recently released edition of its wording, when the form fits it, and for a premium template from the edition the workspace bought, under its own verified order, which the document records. A premium template the workspace holds no live edition of is refused (403). The answers start as given, or else empty apart from the workspace's saved business name; an answer the form does not take is refused."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FormDocumentStart" }
      responses:
        "201":
          description: The new form document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/documents/{id}/form:
    get:
      operationId: getDocumentForm
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "The form text of the edition the document was started with, for its editor to fill. Only the workspace that owns the document can read it."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentFormText" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/documents/{id}/revisions:
    get:
      operationId: listDocumentRevisions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable historical revisions scoped to the workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
schemas:
  DocumentInput:
    type: object
    additionalProperties: false
    required: [title, content]
    properties:
      title: { type: string, minLength: 1, maxLength: 160 }
      content: { $ref: "#/components/schemas/CanonicalDocument" }
  DocumentUpdate:
    type: object
    additionalProperties: false
    required: [expectedRevision, title, content]
    properties:
      expectedRevision: { type: integer, minimum: 1 }
      title: { type: string, minLength: 1, maxLength: 160 }
      content: { $ref: "#/components/schemas/CanonicalDocument" }
  FormDocumentStart:
    type: object
    additionalProperties: false
    required: [templateId]
    properties:
      templateId: { type: string, pattern: "^TPL-[0-9]{2}$" }
      title:
        type: string
        minLength: 1
        maxLength: 160
        description: "The document's title. The template's own name when it is not given."
      formAnswers: { $ref: "#/components/schemas/FormAnswers" }
  FormTemplates:
    type: object
    required: [templates, needsPurchase]
    properties:
      templates:
        type: array
        maxItems: 40
        items:
          type: object
          required: [templateId, editionVersion]
          properties:
            templateId: { type: string, pattern: "^TPL-[0-9]{2}$" }
            editionVersion: { type: integer }
      needsPurchase:
        type: array
        maxItems: 40
        description: "The premium templates whose form, with its wording or its questions only, this workspace can start only once it holds a verified purchase of a live edition."
        items: { type: string, pattern: "^TPL-[0-9]{2}$" }
  DocumentFormText:
    type: object
    required: [edition, editionVersion, title, formText]
    properties:
      edition: { type: string, format: uuid }
      editionVersion: { type: integer }
      title: { type: string }
      formText: { type: string }
  DocumentEditions:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, maxItems: 200, items: { $ref: "#/components/schemas/DocumentEdition" } }
  DocumentEdition:
    type: object
    additionalProperties: false
    required: [documentId, title, version, state, since, reason, current]
    properties:
      documentId: { type: string, format: uuid }
      title: { type: string, description: "The template's title in the edition the document was made from." }
      version: { type: integer, description: "The version of the edition the document was made from." }
      state:
        type: string
        enum: [replaced, withdrawn]
        description: "Replaced: a later edition is released now. Withdrawn: the edition, or the later one that replaced it, was withdrawn and none is released since."
      since:
        type: [string, "null"]
        format: date-time
        description: "When the later edition was released, or when the template was withdrawn, where that is recorded."
      reason: { type: [string, "null"], description: "Why the template was withdrawn, where a reason was recorded." }
      current:
        description: "The template's released edition, when a later one replaced the document's."
        anyOf:
          - type: object
            additionalProperties: false
            required: [version, href]
            properties:
              version: { type: integer }
              href: { type: string }
          - { type: "null" }
  EditionNotices:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items: { type: array, maxItems: 50, items: { $ref: "#/components/schemas/EditionNotice" } }
  EditionNotice:
    type: object
    additionalProperties: false
    required: [id, route, title, version, kind, replacementVersion, reason, held, documents, createdAt]
    properties:
      id: { type: string, format: uuid }
      route: { type: string, enum: [library, reviewed] }
      title: { type: string, description: "The template's title in the edition that changed." }
      version: { type: integer, description: "The version of the edition that changed." }
      kind: { type: string, enum: [replaced, withdrawn] }
      replacementVersion: { type: [integer, "null"], description: "The version that replaced it, for a replaced edition." }
      reason: { type: [string, "null"], description: "Why it was withdrawn, as its editor wrote it for customers." }
      held: { type: boolean, description: "Whether the workspace holds the template through a purchase." }
      documents: { type: integer, minimum: 0, description: "How many of the workspace's documents were made from the edition." }
      createdAt: { type: string, format: date-time, description: "When the edition was replaced or withdrawn." }
