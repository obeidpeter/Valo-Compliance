    type: object
    required: [refunds, disputes, policy]
    properties:
      refunds: { type: array, items: { $ref: "#/components/schemas/RefundRecord" } }
      disputes: { type: array, items: { type: object, additionalProperties: true } }
      policy: { type: string }
  CommerceActionInput:
    type: object
    additionalProperties: false
    properties: {}
  CommerceOrder:
    type: object
    required: [id, reference, title, amountKobo, currency, status, createdAt, lastCheckedAt, licenceVersion, licenceText, taxTreatment, contentVersionId, editions, carriesToLaterEditions, refundStatus, receiptReference, refunds, refundableKobo, refundedKobo, refundPolicy, disputeStatus]
    properties:
      id: { type: string }
      reference: { type: string }
      title: { type: string }
      amountKobo: { type: integer }
      currency: { type: string }
      status: { type: string, enum: [created, pending, abandoned, failed, verified_success, needs_review, reversed] }
      createdAt: { type: string }
      lastCheckedAt: { type: string, nullable: true }
      licenceVersion: { type: string }
      licenceText: { type: string }
      taxTreatment: { type: string }
      contentVersionId: { type: [string, "null"], description: "The edition a template's order buys; none for a bundle's order" }
      editions:
        description: "Each edition the order grants, with the title it copied: one for a template's order, one for each of a bundle's templates."
        type: array
        minItems: 1
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [contentVersionId, title]
          properties:
            contentVersionId: { type: string }
            title: { type: string }
      carriesToLaterEditions:
        type: boolean
        description: "The access rule the order recorded when it was made, and keeps: whether the purchase carries to its template's later editions. An order made before the rule had a record carries."
      refundStatus: { type: string, nullable: true }
      receiptReference: { type: string, nullable: true }
      refunds: { type: array, items: { $ref: "#/components/schemas/RefundRecord" } }
      refundableKobo: { type: integer }
      refundedKobo: { type: integer }
      refundPolicy: { type: string }
      disputeStatus: { type: [string, "null"] }
