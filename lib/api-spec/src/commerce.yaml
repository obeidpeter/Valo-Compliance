    required: [acceptedLicenceVersion, acceptedCarriesToLaterEditions, requestKey]
    properties:
      priceId: { type: string, format: uuid }
      bundleId: { type: string, format: uuid, description: "The bundle's version on sale" }
      acceptedLicenceVersion: { type: string, minLength: 1, maxLength: 100 }
      acceptedCarriesToLaterEditions:
        type: boolean
        description: The access rule the buyer was shown, which must be the rule in effect when the order is made.
      requestKey: { type: string, format: uuid }
  CommerceRefundInput:
