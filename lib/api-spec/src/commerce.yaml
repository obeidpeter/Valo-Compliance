      effectiveTo: { type: [string, "null"], format: date-time }
  OwnerSettingTerms:
    type: object
    additionalProperties: false
    required: [key, value, from]
    properties:
      key: { $ref: "#/components/schemas/OwnerSettingKey" }
      value: { type: string, pattern: "^(\\d{1,7}|yes|no)$", description: "A whole number, such as 30, or yes or no" }
      from: { type: string, minLength: 3, maxLength: 40, description: "now, or a time with its offset, such as 2026-12-01T00:00:00+01:00" }
  OwnerSettingExactTerms:
    type: object
    additionalProperties: false
    required: [key, value, from]
    properties:
      key: { $ref: "#/components/schemas/OwnerSettingKey" }
      value: { type: [integer, boolean], minimum: 0 }
      from: { type: string }
  OwnerSettingPreview:
    type: object
    additionalProperties: false
    required: [kind, title, unit, yes, no, terms, checksum]
    properties:
      kind: { $ref: "#/components/schemas/OwnerSettingKind" }
      title: { type: string }
      unit: { type: [string, "null"] }
      yes: { type: [string, "null"] }
      no: { type: [string, "null"] }
      terms: { $ref: "#/components/schemas/OwnerSettingExactTerms" }
      checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
  OwnerSettingRecord:
    type: object
    additionalProperties: false
    required: [key, value, from, reference, confirm]
    properties:
      key: { $ref: "#/components/schemas/OwnerSettingKey" }
      value: { type: string, pattern: "^(\\d{1,7}|yes|no)$" }
      from: { type: string, minLength: 3, maxLength: 40 }
      reference: { type: string, minLength: 3, maxLength: 160, description: Where the owner's approval is written }
      confirm: { type: string, pattern: "^[0-9a-f]{64}$", description: The checksum the preview gave }
  OwnerSettingRecorded:
    type: object
    additionalProperties: false
    required: [settingId, key, value, from, closed]
    properties:
      settingId: { type: string, format: uuid }
      key: { $ref: "#/components/schemas/OwnerSettingKey" }
      value: { type: [integer, boolean], minimum: 0 }
      from: { type: string, format: date-time }
      closed:
        type: array
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [settingId, value]
          properties:
            settingId: { type: string, format: uuid }
            value: { type: [integer, boolean], minimum: 0 }
  CustomerPurchases:
    type: object
    required: [available, message, orders, products, bundles, ownedDownloads, livePaymentsEnabled, purchaseCarriesToLaterEditions]
    properties:
      available: { type: boolean }
      message: { type: string }
      livePaymentsEnabled: { type: boolean }
      purchaseCarriesToLaterEditions:
        type: boolean
        description: "The access rule a purchase made now records: whether it carries to its template's later editions at no further charge, or covers only the edition bought, while it stays released (docs/architecture/commercial-settings.md, slice 3b). An order is made only with this rule accepted."
      hasMoreOrders: { type: boolean }
      orders: { type: array, items: { $ref: "#/components/schemas/CommerceOrder" } }
      products:
        type: array
        items: { $ref: "#/components/schemas/TemplateOffer" }
      bundles:
        type: array
        description: "The bundles on sale now that hold no template the workspace already owns (docs/architecture/commercial-settings.md, slice 4c)."
        items: { $ref: "#/components/schemas/BundleOffer" }
      ownedDownloads:
        type: array
        description: Downloads for the signed-in workspace's currently released purchases, indexed by current or past approved offer.
        items: { $ref: "#/components/schemas/OwnedCheckoutDownload" }
  BundleOffer:
    type: object
    additionalProperties: false
    required: [id, bundle, title, amountKobo, currency, licenceVersion, licenceText, taxTreatment, templates]
    properties:
      id: { type: string, format: uuid, description: "The bundle's version on sale, which an order names" }
      bundle: { type: string, description: "The bundle's name across its versions" }
      title: { type: string }
      amountKobo: { type: integer, minimum: 1 }
