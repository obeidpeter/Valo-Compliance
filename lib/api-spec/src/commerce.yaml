      yes: { type: [string, "null"], description: "What yes means; none for a whole number" }
      no: { type: [string, "null"], description: "What no means; none for a whole number" }
      defaultValue: { type: [integer, boolean], minimum: 0, description: "The value while no value the owner recorded is in effect" }
      max: { type: [integer, "null"], minimum: 0 }
      values:
        description: The value in effect and any scheduled to start, earliest first.
        type: array
        maxItems: 100
