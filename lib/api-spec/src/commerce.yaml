schemas:
  DisputeHistory: {"type":"object","additionalProperties":false,"required":["id","action","reason","actorType","createdAt"],"properties":{"id":{"type":"string"},"action":{"type":"string"},"reason":{"type":"string"},"actorType":{"type":"string","enum":["customer","finance","worker"]},"createdAt":{"type":"string"}}}
  PaymentConcern: {"type":"object","additionalProperties":false,"required":["id","orderId","orderReference","message","status","latestReply","version","createdAt","updatedAt","history"],"properties":{"id":{"type":"string"},"orderId":{"type":"string"},"orderReference":{"type":"string"},"message":{"type":"string"},"status":{"type":"string","enum":["open","needs_information","responded","closed"]},"latestReply":{"type":["string","null"]},"version":{"type":"integer"},"createdAt":{"type":"string"},"updatedAt":{"type":"string"},"history":{"type":"array","items":{"$ref":"#/components/schemas/DisputeHistory"}}}}
  PaymentConcernInput: {"type":"object","additionalProperties":false,"required":["requestKey","message","acknowledgement"],"properties":{"requestKey":{"type":"string","format":"uuid"},"message":{"type":"string","minLength":20,"maxLength":2000},"acknowledgement":{"type":"boolean","enum":[true]}}}
  PaymentConcernResponse: {"type":"object","additionalProperties":false,"required":["expectedVersion","message"],"properties":{"expectedVersion":{"type":"integer","minimum":1},"message":{"type":"string","minLength":10,"maxLength":2000}}}
  PaymentConcernAction: {"type":"object","additionalProperties":false,"required":["expectedVersion","action","message"],"properties":{"expectedVersion":{"type":"integer","minimum":1},"action":{"type":"string","enum":["reply","request_information","close"]},"message":{"type":"string","minLength":10,"maxLength":2000}}}
  WorkspaceDisputes: {"type": "object", "additionalProperties": false, "required": ["concerns", "notice"], "properties": {"concerns": {"type": "array", "items": {"$ref": "#/components/schemas/PaymentConcern"}}, "notice": {"type": "string"}}}
  FinancePaymentConcerns: {"type": "object", "additionalProperties": false, "required": ["concerns", "notice"], "properties": {"concerns": {"type": "array", "items": {"$ref": "#/components/schemas/PaymentConcern"}}, "notice": {"type": "string"}}}
  DisputeHoldInput: {"type": "object", "additionalProperties": false, "required": ["expectedVersion", "held", "reason"], "properties": {"expectedVersion": {"type": "integer", "minimum": 1}, "held": {"type": "boolean"}, "reason": {"type": "string", "minLength": 10, "maxLength": 1500}}}
  FinanceDisputeLink: {"type": "object", "additionalProperties": false, "required": ["orderId", "providerId"], "properties": {"orderId": {"type": "string", "format": "uuid"}, "providerId": {"type": "string", "pattern": "^\\d{1,40}$"}}}
  OwnerPricePage:
    type: object
    additionalProperties: false
    required: [items]
    properties:
      items:
        type: array
        maxItems: 500
        items: { $ref: "#/components/schemas/OwnerPricedTemplate" }
  OwnerPricedTemplate:
    type: object
    additionalProperties: false
    required: [edition, itemId, version, title, publishedAt, prices]
    properties:
      edition: { type: string, format: uuid }
      itemId: { type: string, format: uuid }
      version: { type: integer, minimum: 1 }
      title: { type: string }
      publishedAt: { type: [string, "null"], format: date-time }
      prices:
        description: The open price and any scheduled to start, earliest first.
        type: array
        maxItems: 100
        items: { $ref: "#/components/schemas/OwnerPrice" }
  OwnerPrice:
    type: object
    additionalProperties: false
    required: [priceId, amountKobo, licenceVersion, taxTreatment, effectiveFrom, effectiveTo, carriesToLaterEditions, carriedFrom]
    properties:
      priceId: { type: string, format: uuid }
      amountKobo: { type: integer, minimum: 1 }
      licenceVersion: { type: string }
      taxTreatment: { type: string }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: [string, "null"], format: date-time }
      carriesToLaterEditions: { type: boolean }
      carriedFrom: { type: [string, "null"], format: uuid, description: "The price this one was carried from, at its edition's release" }
  OwnerPriceTerms:
    type: object
    additionalProperties: false
    required: [edition, amount, licenceVersion, licenceText, taxTreatment, from, carries]
    properties:
      carries: { type: boolean, description: "Whether the price is recorded for each later edition of the template as it is released" }
      edition: { type: string, format: uuid }
      amount: { type: string, pattern: "^\\d{1,8}(\\.\\d{2})?$", description: "The amount in naira, such as 1500 or 1500.00" }
      licenceVersion: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
      licenceText: { type: string, minLength: 20, maxLength: 20000 }
      taxTreatment: { type: string, minLength: 3, maxLength: 300 }
      from: { type: string, minLength: 3, maxLength: 40, description: "now, or a time with its offset, such as 2026-12-01T00:00:00+01:00" }
  OwnerPriceExactTerms:
    type: object
    additionalProperties: false
    required: [edition, amountKobo, licenceVersion, licenceText, taxTreatment, from, carries]
    properties:
      carries: { type: boolean }
      edition: { type: string, format: uuid }
      amountKobo: { type: integer, minimum: 1 }
      licenceVersion: { type: string }
      licenceText: { type: string }
      taxTreatment: { type: string }
      from: { type: string }
  OwnerPricePreview:
    type: object
    additionalProperties: false
    required: [title, terms, checksum]
    properties:
      title: { type: string }
      terms: { $ref: "#/components/schemas/OwnerPriceExactTerms" }
      checksum: { type: string, pattern: "^[0-9a-f]{64}$" }
  OwnerPriceRecord:
    type: object
    additionalProperties: false
    required: [edition, amount, licenceVersion, licenceText, taxTreatment, from, carries, reference, confirm]
    properties:
      carries: { type: boolean }
      edition: { type: string, format: uuid }
      amount: { type: string, pattern: "^\\d{1,8}(\\.\\d{2})?$" }
      licenceVersion: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$" }
      licenceText: { type: string, minLength: 20, maxLength: 20000 }
      taxTreatment: { type: string, minLength: 3, maxLength: 300 }
      from: { type: string, minLength: 3, maxLength: 40 }
      reference: { type: string, minLength: 3, maxLength: 160, description: Where the owner's approval is written }
      confirm: { type: string, pattern: "^[0-9a-f]{64}$", description: The checksum the preview gave }
  OwnerPriceRecorded:
    type: object
    additionalProperties: false
    required: [priceId, edition, title, amountKobo, from, closed]
    properties:
      priceId: { type: string, format: uuid }
      edition: { type: string, format: uuid }
      title: { type: string }
      amountKobo: { type: integer, minimum: 1 }
      from: { type: string, format: date-time }
      closed:
        type: array
        maxItems: 100
        items:
          type: object
          additionalProperties: false
          required: [priceId, amountKobo]
          properties:
            priceId: { type: string, format: uuid }
            amountKobo: { type: integer, minimum: 1 }
  OwnerBundlePage:
    type: object
    additionalProperties: false
    required: [versions, templates]
    properties:
      versions:
        description: Each bundle's open version and any scheduled to start, by bundle and then earliest first.
        type: array
        maxItems: 500
        items: { $ref: "#/components/schemas/OwnerBundleVersion" }
      templates:
        description: The premium templates of the staff library that have been released, by title.
        type: array
        maxItems: 500
        items: { $ref: "#/components/schemas/OwnerBundleTemplate" }
  OwnerBundleTemplate:
    type: object
