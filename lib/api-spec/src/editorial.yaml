# Source controls, editorial records and correction notices.
paths:
  /admin/source-controls: {"get": {"operationId": "getSourceControls", "tags": ["staff"], "parameters": [{"name": "area", "in": "query", "required": true, "schema": {"type": "string", "enum": ["content", "system"]}}, {"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 10000, "default": 1}}], "responses": {"200": {"description": "Current authorized result. No publication or spending approval is granted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SourceControls"}}}}, "401": {"description": "Sign-in required"}, "403": {"description": "Active area role and recent MFA required"}, "409": {"description": "Changed version or request-key conflict"}}}}
  /admin/source-controls/action: {"post": {"operationId": "actOnSourceControls", "tags": ["staff"], "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SourceControlAction"}}}}, "responses": {"200": {"description": "Current authorized result. No publication or spending approval is granted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/SourceControlResult"}}}}, "401": {"description": "Sign-in required"}, "403": {"description": "Active area role and recent MFA required"}, "409": {"description": "Changed version or request-key conflict"}}}}
  /admin/source-register:
    get:
      operationId: listSourceRegister
      tags: [staff]
      summary: The source register, for content staff
      description: >-
        Each official source as staff keep it, with every earlier version and its watch
        (docs/architecture/source-register.md, slice 1, ADM-003). Development only.
      responses:
        '200': { description: 'The register. Nothing is published or fetched.', content: { application/json: { schema: { $ref: '#/components/schemas/SourceRegister' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active Content editor with recent MFA is required }
        '503': { description: The register migration has not been applied }
  /admin/source-register/file:
    post:
      operationId: fileSourceRegister
      tags: [staff]
      summary: File the regulatory sources kept in the repository into the register
      description: >-
        Files each regulatory source lead kept in the repository that the register does not hold yet,
        as its first version, with what the claim maps and amendment records say of it. Filing again
        files nothing more.
      responses:
        '200': { description: 'The register after filing.', content: { application/json: { schema: { $ref: '#/components/schemas/SourceRegister' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active Content editor with recent MFA is required }
        '503': { description: The register migration has not been applied }
  /admin/source-register/{sourceId}/versions:
    post:
      operationId: reviseSourceRegisterEntry
      tags: [staff]
      summary: Record the next version of a source's entry
      description: >-
        Its corrected fields, or its retirement or return, with why. The title and address stay its
        own, and no version is ever changed or removed.
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SourceRegisterRevision' } } }
      responses:
        '200': { description: 'The register after the new version.', content: { application/json: { schema: { $ref: '#/components/schemas/SourceRegister' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active Content editor with recent MFA is required }
        '404': { description: The source is not in the register }
        '409': { description: The entry changed since it was read }
        '422': { description: 'A field is invalid, nothing changed, or why is missing' }
  /admin/editorial-records/{kind}/{id}:
    get:
      operationId: getEditorialRecord
      tags: [staff]
      summary: One version's publication record, for content staff
      description: >-
        The stored bundle's current check, the drafting and review runs, check counts, safety holds
        and publication audit of one content or rule version (ADM-002). Read-only: it approves,
        publishes and holds nothing.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string, enum: [content, rule] } }
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Current authorized record. No publication or spending approval is granted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialRecord" }
        "401": { description: Sign-in required }
        "403": { description: Active content role and recent MFA required }
        "404": { description: No such version }
  /admin/owner-rules:
    get:
      operationId: listOwnerRules
      tags: [staff]
      summary: Requirements-checker rules prepared for the development owner's sign-off (decision 0020)
      description: >-
        Each rule as the owner would sign it now: what it tells a customer, its sources and their
        checks, its scenarios, how many saved results it would change, and what holds it. Read-only.
      responses:
        "200":
          description: The prepared rules. Nothing is released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerRulePage" }
        "403": { description: Recently verified development owner required }
  /admin/owner-rules/{ruleId}/source-watches:
    post:
      operationId: watchOwnerRuleSources
      tags: [staff]
      summary: Have the daily source check watch a prepared rule's official sources
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerRuleSourceWatch" }
      responses:
        "200":
          description: The rule, with its sources watched. Nothing is fetched or released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerRuleItem" }
        "403": { description: Recently verified development owner required }
        "404": { description: No rule is prepared under that name }
  /admin/owner-rules/{ruleId}/decisions:
    post:
      operationId: decideOwnerRule
      tags: [staff]
      summary: Sign and release a prepared rule's version, or withdraw a released one
      parameters:
        - { name: ruleId, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerRuleDecision" }
      responses:
        "200":
          description: The released or withdrawn version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerRuleReceipt" }
        "403": { description: Recently verified development owner required }
        "404": { description: No rule is prepared under that name }
        "409": { description: "The rule, its sources or its release changed, or something holds it" }
        "422": { description: A confirmation or the reason is missing }
  /workspace/correction-notices: {"get": {"operationId": "getCorrectionNotices", "tags": ["workspace"], "parameters": [{"name": "page", "in": "query", "schema": {"type": "integer", "minimum": 1, "maximum": 10000, "default": 1}}], "responses": {"200": {"description": "Current authorized result. No publication or spending approval is granted.", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CorrectionNotices"}}}}, "401": {"description": "Sign-in required"}, "403": {"description": "Active area role and recent MFA required"}, "409": {"description": "Changed version or request-key conflict"}}}}
schemas:
  SourceControlAction: {"oneOf": [{"type": "object", "required": ["requestKey", "reason", "action", "sourceId"], "properties": {"requestKey": {"type": "string", "format": "uuid"}, "reason": {"type": "string", "minLength": 20, "maxLength": 1000}, "action": {"type": "string", "enum": ["watch_source"]}, "sourceId": {"type": "string", "minLength": 1, "maxLength": 100}}, "additionalProperties": false}, {"type": "object", "required": ["requestKey", "reason", "action", "kind", "id", "version"], "properties": {"requestKey": {"type": "string", "format": "uuid"}, "reason": {"type": "string", "minLength": 20, "maxLength": 1000}, "action": {"type": "string", "enum": ["hold_version"]}, "kind": {"type": "string", "enum": ["content", "rule"]}, "id": {"type": "string", "format": "uuid"}, "version": {"type": "integer", "minimum": 1}}, "additionalProperties": false}, {"type": "object", "required": ["requestKey", "reason", "action", "kind", "id", "version"], "properties": {"requestKey": {"type": "string", "format": "uuid"}, "reason": {"type": "string", "minLength": 20, "maxLength": 1000}, "action": {"type": "string", "enum": ["withdraw_version"]}, "kind": {"type": "string", "enum": ["content", "rule"]}, "id": {"type": "string", "format": "uuid"}, "version": {"type": "integer", "minimum": 1}}, "additionalProperties": false}, {"type": "object", "required": ["requestKey", "reason", "action", "service"], "properties": {"requestKey": {"type": "string", "format": "uuid"}, "reason": {"type": "string", "minLength": 20, "maxLength": 1000}, "action": {"type": "string", "enum": ["pause_service"]}, "service": {"type": "string", "enum": ["ai", "checkout"]}}, "additionalProperties": false}, {"type": "object", "required": ["requestKey", "reason", "action", "service"], "properties": {"requestKey": {"type": "string", "format": "uuid"}, "reason": {"type": "string", "minLength": 20, "maxLength": 1000}, "action": {"type": "string", "enum": ["resume_service"]}, "service": {"type": "string", "enum": ["ai", "checkout"]}}, "additionalProperties": false}]}
  SourceControlResult: {"type": "object", "required": ["auditId", "replayed", "result"], "properties": {"auditId": {"type": "string", "format": "uuid"}, "replayed": {"type": "boolean"}, "result": {"type": "object", "additionalProperties": true}}}
  SourceControlVersion: {"type": "object", "required": ["kind", "id", "key", "version", "status", "reviewBy", "safetyHeld"], "properties": {"kind": {"type": "string", "enum": ["content", "rule"]}, "id": {"type": "string", "format": "uuid"}, "key": {"type": "string"}, "version": {"type": "integer"}, "status": {"type": "string"}, "reviewBy": {"type": ["string", "null"]}, "safetyHeld": {"type": "boolean"}}}
  SourceControlWatch: {"type": "object", "required": ["sourceId", "url", "risk", "checkedAt", "failureCode", "nextCheckAt"], "properties": {"sourceId": {"type": "string"}, "url": {"type": "string"}, "risk": {"type": "string"}, "checkedAt": {"type": ["string", "null"]}, "failureCode": {"type": ["string", "null"]}, "nextCheckAt": {"type": "string", "format": "date-time"}}}
  SourceControlReview: {"type": "object", "required": ["id", "status", "targetKind", "targetKey", "targetVersion", "reason", "createdAt"], "properties": {"id": {"type": "string", "format": "uuid"}, "status": {"type": "string"}, "targetKind": {"type": "string"}, "targetKey": {"type": "string"}, "targetVersion": {"type": "integer"}, "reason": {"type": "string"}, "createdAt": {"type": "string", "format": "date-time"}}}
  SourceControlService: {"type": "object", "required": ["key", "enabled", "reason", "updatedAt"], "properties": {"key": {"type": "string"}, "enabled": {"type": "boolean"}, "reason": {"type": "string"}, "updatedAt": {"type": "string", "format": "date-time"}}}
  SourceControlChoice: {"type": "object", "required": ["id", "title"], "properties": {"id": {"type": "string"}, "title": {"type": "string"}}}
  SourceRegisterFields:
    type: object
    required: [version, title, authority, jurisdiction, instrument, versionInForce, effectiveFrom, status, reason, createdBy, createdAt]
    properties:
      version: { type: integer, minimum: 1 }
      title: { type: string }
      authority: { type: [string, 'null'], description: 'The body that issues the text. Empty until it is known.' }
      jurisdiction: { type: string, description: 'Nigeria, or one of the states the requirements check lists.' }
      instrument: { type: [string, 'null'], enum: [act, regulatory_document, official_page, null] }
      versionInForce: { type: [string, 'null'], description: 'The edition in force, as the text names it.' }
      effectiveFrom: { type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$', description: 'The day the version in force took effect. An official page has none.' }
      status: { type: string, enum: [active, retired] }
      reason: { type: string, description: 'Why this version was recorded.' }
      createdBy: { type: string }
      createdAt: { type: string }
  SourceRegisterEntry:
    allOf:
      - $ref: '#/components/schemas/SourceRegisterFields'
      - type: object
        required: [sourceId, url, earlier, watch]
        properties:
          sourceId: { type: string }
          url: { type: string }
          earlier: { type: array, description: 'Its earlier versions, newest first.', items: { $ref: '#/components/schemas/SourceRegisterFields' } }
          watch:
            description: Its daily check as it last ran, or null while it is not watched.
            anyOf:
              - type: object
                required: [checkedAt, failureCode, nextCheckAt]
                properties:
                  checkedAt: { type: [string, 'null'] }
                  failureCode: { type: [string, 'null'] }
                  nextCheckAt: { type: [string, 'null'] }
              - { type: 'null' }
  SourceRegister:
    type: object
    required: [entries, unfiled, jurisdictions]
    properties:
      entries: { type: array, items: { $ref: '#/components/schemas/SourceRegisterEntry' } }
      unfiled: { type: integer, minimum: 0, description: 'How many regulatory sources kept in the repository are not filed yet.' }
      jurisdictions: { type: array, items: { type: string } }
  SourceRegisterRevision:
    type: object
    required: [baseVersion, authority, jurisdiction, instrument, versionInForce, effectiveFrom, status, reason]
    additionalProperties: false
    properties:
      baseVersion: { type: integer, minimum: 1, description: 'The latest version, as read.' }
      authority: { type: [string, 'null'], maxLength: 200 }
      jurisdiction: { type: string, maxLength: 60 }
      instrument: { type: [string, 'null'], enum: [act, regulatory_document, official_page, null] }
      versionInForce: { type: [string, 'null'], maxLength: 200 }
      effectiveFrom: { type: [string, 'null'], pattern: '^\d{4}-\d{2}-\d{2}$' }
      status: { type: string, enum: [active, retired] }
      reason: { type: string, maxLength: 1000, description: 'Why, in 20 to 1,000 characters.' }
  SourceControls: {"type": "object", "required": ["area", "page", "hasMore", "notice", "versions", "sources", "review", "services", "sourceChoices"], "properties": {"area": {"type": "string", "enum": ["content", "system"]}, "page": {"type": "integer"}, "hasMore": {"type": "boolean"}, "notice": {"type": "string"}, "versions": {"type": "array", "items": {"$ref": "#/components/schemas/SourceControlVersion"}}, "sources": {"type": "array", "items": {"$ref": "#/components/schemas/SourceControlWatch"}}, "review": {"type": "array", "items": {"$ref": "#/components/schemas/SourceControlReview"}}, "services": {"type": "array", "items": {"$ref": "#/components/schemas/SourceControlService"}}, "sourceChoices": {"type": "array", "items": {"$ref": "#/components/schemas/SourceControlChoice"}}}}
  EditorialRun:
    type: object
    required: [runId, model, promptVersion]
    properties:
      runId: { type: string }
      model: { type: string }
      promptVersion: { type: string }
  EditorialReview:
    type: object
    required: [role, runId, model, promptVersion, verdict, findings, receivedOtherVerdict]
    properties:
      role: { type: string, enum: [factual, challenge] }
      runId: { type: string }
      model: { type: string }
      promptVersion: { type: string }
      verdict: { type: string, enum: [pass, hold] }
      findings:
        description: The review's findings, at most 20, each cut to 600 characters.
        type: array
        items: { type: string }
      receivedOtherVerdict: { type: boolean }
  EditorialCheckCounts:
    type: object
    required: [passed, failed, notRun]
    properties:
      passed: { type: integer }
      failed: { type: integer }
      notRun: { type: integer }
  EditorialRecord:
    type: object
    required:
      [kind, id, key, version, status, reviewBy, publishedAt, withdrawnReason, candidateHash, manifestStatus,
       check, draftRun, reviews, mechanicalChecks, enhancedChecks, audit, safetyHolds, notice]
    properties:
      kind: { type: string, enum: [content, rule] }
      id: { type: string, format: uuid }
      key: { type: string }
      version: { type: integer }
      status: { type: string }
      reviewBy: { type: [string, "null"] }
      publishedAt: { type: [string, "null"] }
      withdrawnReason: { type: [string, "null"] }
      candidateHash: { type: [string, "null"] }
      manifestStatus: { type: [string, "null"] }
      check:
        description: What the stored bundle passes or holds on at checkedAt. The publisher rechecks every gate before a release.
        type: object
        required: [checkedAt, decision, reasons]
        properties:
          checkedAt: { type: string, format: date-time }
          decision: { type: string, enum: [eligible, hold] }
          reasons: { type: array, items: { type: string } }
      draftRun:
        oneOf:
          - { $ref: "#/components/schemas/EditorialRun" }
          - { type: "null" }
      reviews: { type: array, items: { $ref: "#/components/schemas/EditorialReview" } }
      mechanicalChecks: { $ref: "#/components/schemas/EditorialCheckCounts" }
      enhancedChecks: { $ref: "#/components/schemas/EditorialCheckCounts" }
      audit:
        type: array
        items:
          type: object
          required: [action, actor, reason, at]
          properties:
            action: { type: string }
            actor: { type: string }
            reason: { type: string }
            at: { type: string, format: date-time }
      safetyHolds:
        type: array
        items:
          type: object
          required: [action, reason, phase, createdAt, completedAt]
          properties:
            action: { type: string }
            reason: { type: string }
            phase: { type: string }
            createdAt: { type: string, format: date-time }
            completedAt: { type: [string, "null"] }
      notice: { type: string }
  CorrectionNotice: {"type": "object", "required": ["id", "entityKind", "entityId", "message", "createdAt"], "properties": {"id": {"type": "string", "format": "uuid"}, "entityKind": {"type": "string"}, "entityId": {"type": "string", "format": "uuid"}, "message": {"type": "string"}, "createdAt": {"type": "string", "format": "date-time"}}}
  CorrectionNotices: {"type": "object", "required": ["page", "hasMore", "notices"], "properties": {"page": {"type": "integer"}, "hasMore": {"type": "boolean"}, "notices": {"type": "array", "items": {"$ref": "#/components/schemas/CorrectionNotice"}}}}
  OwnerRulePage:
    type: object
    required: [items]
    properties:
      items: { type: array, items: { $ref: "#/components/schemas/OwnerRuleItem" } }
  OwnerRuleReferral:
    type: object
    required: [reference, version, status, reason, held, referredAt]
    properties:
      reference: { type: string }
      version: { type: integer, minimum: 1 }
      status: { type: string, enum: [queued, acknowledged] }
      reason: { type: string }
      held:
        type: boolean
        description: Whether content staff held that version through the source controls, which keeps it out of the requirements check.
      referredAt: { type: string, format: date-time }
  OwnerRuleItem:
    type: object
    required:
      [ruleId, title, reason, nextStep, appliesWhen, jurisdiction, validFrom, validTo, risk, scope, limitations, assumptions, disclosure, version, manifestHash, live, holds, checks, sources, scenarios, profilesRun, changedProfiles, referrals]
    properties:
      ruleId: { type: string }
      title: { type: string }
      reason:
        description: What the rule tells a customer when it applies; null when a fixed calculation words it for each customer's answers (see each scenario).
        type: [string, "null"]
      nextStep:
        description: The next step the rule suggests when it applies; null when a fixed calculation words it for each customer's answers.
        type: [string, "null"]
      appliesWhen: { type: string }
      jurisdiction: { type: string }
      validFrom: { type: string }
      validTo: { type: [string, "null"] }
      risk: { type: string }
      scope: { type: string }
      limitations: { type: string }
      assumptions: { type: array, items: { type: string } }
      disclosure: { type: string }
      version: { type: integer, minimum: 1 }
      manifestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      live:
        anyOf:
          - type: object
            required: [version, manifestHash]
            properties: { version: { type: integer }, manifestHash: { type: string } }
          - { type: "null" }
      holds: { type: array, items: { type: string } }
      checks: { type: array, items: { $ref: "#/components/schemas/OwnerRuleCheck" } }
      sources: { type: array, items: { $ref: "#/components/schemas/OwnerRuleSource" } }
      scenarios: { type: array, items: { $ref: "#/components/schemas/OwnerRuleScenario" } }
      profilesRun: { type: integer, minimum: 0 }
      changedProfiles: { type: integer, minimum: 0 }
      referrals:
        type: array
        description: Support referrals not yet resolved that point at a version of this rule the owner signed, newest first (docs/architecture/library-holds.md, slice 3).
        items: { $ref: "#/components/schemas/OwnerRuleReferral" }
      officialRoute:
        $ref: "#/components/schemas/RequirementRoute"
      figures:
        type: array
        description: Each fee, deadline, rate or threshold the rule records, with the passage it rests on, as a customer would see it. Absent when it records none.
        items: { $ref: "#/components/schemas/OwnerRuleFigure" }
  OwnerRuleFigure:
    type: object
    required: [kind, words, source]
    properties:
      kind: { type: string, enum: [fee, deadline, rate, threshold] }
      words: { type: string }
      source: { type: string, description: "The source's title and where in it the words are." }
  OwnerRuleCheck:
    type: object
    required: [id, label]
    properties:
      id: { $ref: "#/components/schemas/OwnerRuleCheckId" }
      label: { type: string }
  OwnerRuleCheckId:
    type: string
    enum: [controlling_text, amendments, effective_dates, exceptions, jurisdiction]
  OwnerRuleSource:
    type: object
    required:
      [title, url, locator, quote, watched, checkedAt, failure, current, passage, recordedLocator, effectiveFrom, amendments]
    properties:
      title: { type: string }
      url: { type: [string, "null"] }
      locator: { type: string }
      quote: { type: string }
      watched: { type: boolean }
      checkedAt: { type: [string, "null"] }
      failure: { type: [string, "null"] }
      current: { type: boolean }
      passage: { type: [string, "null"] }
      recordedLocator: { type: [string, "null"] }
      effectiveFrom: { type: [string, "null"] }
      amendments:
        anyOf:
          - { $ref: "#/components/schemas/OwnerRuleAmendmentRecord" }
          - { type: "null" }
  OwnerRuleAmendmentRecord:
    type: object
    required: [searchedAt, places, read, notRead, open, limits]
    properties:
      searchedAt: { type: [string, "null"] }
      places: { type: array, items: { type: string } }
      read: { type: array, items: { type: string } }
      notRead: { type: array, items: { type: string } }
      open: { type: array, items: { type: string } }
      limits: { type: string }
  OwnerRuleScenario:
    type: object
    required: [id, critical, expectedLabel, actualLabel, actualReason, actualNextStep, passed]
    properties:
      id: { type: string }
      critical: { type: boolean }
      expectedLabel: { type: [string, "null"] }
      actualLabel: { type: [string, "null"] }
      actualReason:
        description: What the requirements check would tell the customer for these answers, were this version released; null when the rule gives no result for them.
        type: [string, "null"]
      actualNextStep: { type: [string, "null"] }
      passed: { type: boolean }
  OwnerRuleSourceWatch:
    type: object
    required: [watch]
    properties:
      watch: { type: string, enum: [official_sources] }
  OwnerRuleDecision:
    type: object
    required: [action, version, manifestHash, confirmedChecks, confirmed]
    properties:
      action: { type: string, enum: [sign, withdraw] }
      version: { type: integer, minimum: 1 }
      manifestHash: { type: string, pattern: "^[a-f0-9]{64}$" }
      confirmedChecks: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/OwnerRuleCheckId" } }
      confirmed: { type: boolean, enum: [true] }
      reason:
        type: string
        minLength: 20
        maxLength: 1000
        description: Why the released version is withdrawn, or what changed in the version signed to replace it. The businesses that saved a result or made a task under the old version are told it (docs/architecture/rule-changes.md). Required for a withdrawal, and for a sign-off while a version is released.
  OwnerRuleReceipt:
    type: object
    required: [ruleId, version, state, superseded]
    properties:
      ruleId: { type: string }
      version: { type: integer }
      state: { type: string, enum: [published, withdrawn] }
      superseded: { type: array, items: { type: integer } }
