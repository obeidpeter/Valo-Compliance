# Generated by bundle.mjs from the files in src/. Do not edit: change the module's file in src/,
# then run `pnpm --filter @workspace/api-spec run codegen`.
openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /admin/acceptance-cases:
    get:
      operationId: listAcceptanceCases
      tags: [staff]
      summary: One corpus's acceptance cases, with the latest decision on each case's current hash
      description: >-
        For an active reviewer with recent MFA only. Each case gives its expected outcome, its critical
        failure conditions, its sources and the hash the suites bind it by. A decision holds only for the
        hash it names. Nothing here accepts a case or a requirement. Development only.
      parameters:
        - { name: corpus, in: query, required: true, schema: { type: string, enum: [editorial, checker, customer_ai] } }
      responses:
        '200': { description: 'The corpus''s cases. Nothing is accepted.', content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceCases' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active reviewer with recent MFA is required }
        '404': { description: There is no such corpus }
        '503': { description: The acceptance review migration has not been applied }
  /admin/acceptance-cases/decisions:
    post:
      operationId: recordAcceptanceDecision
      tags: [staff]
      summary: Confirm or reject a case's expected outcome, for the case's hash as the reviewer read it
      description: >-
        One decision, kept for good: a later decision is a new row, and the database never changes or
        removes one. A case that changed since the reviewer read it is refused.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceDecision' } } }
      responses:
        '201': { description: 'The corpus''s cases with the decision recorded.', content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceCases' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active reviewer with recent MFA is required }
        '404': { description: The case is not in the corpus }
        '409': { description: The case changed since the reviewer read it }
        '422': { description: Why is missing or too long }
        '503': { description: The acceptance review migration has not been applied }
  /admin/acceptance-runs:
    get:
      operationId: listAcceptanceRun
      tags: [staff]
      summary: The latest run of a corpus's suite kept for a reviewer, with what it left for a reviewer
      description: >-
        For an active reviewer with recent MFA only. A suite's command keeps a run: every case with the
        suite's status for it, and for each case the suite cannot score itself, what the reviewer reads.
        A decision on a run holds only for the case as kept. Nothing here accepts a case or a requirement.
        Development only.
      parameters:
        - { name: corpus, in: query, required: true, schema: { type: string, enum: [editorial, checker, customer_ai] } }
      responses:
        '200': { description: 'The latest kept run, or none. Nothing is accepted.', content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceRunView' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active reviewer with recent MFA is required }
        '404': { description: There is no such corpus }
        '503': { description: The acceptance runs migration has not been applied }
  /admin/acceptance-runs/decisions:
    post:
      operationId: recordAcceptanceRunDecision
      tags: [staff]
      summary: Record whether a kept run met a case, for the case as kept
      description: >-
        One decision, kept for good: met or not met, with why, bound to the run and the hash of the case
        as the reviewer read it. A case the run left nothing on, or a hash that is not the case as kept,
        is refused.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceRunDecision' } } }
      responses:
        '201': { description: 'The kept run with the decision recorded.', content: { application/json: { schema: { $ref: '#/components/schemas/AcceptanceRunView' } } } }
        '401': { description: Sign-in required }
        '403': { description: An active reviewer with recent MFA is required }
        '404': { description: 'The run, or the case in it, is not there to decide on' }
        '409': { description: 'The case or the run is not as the reviewer read it' }
        '422': { description: Why is missing or too long }
        '503': { description: The acceptance runs migration has not been applied }
  /workspace/ai-drafts:
    post:
      operationId: createCustomerAIDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAIInput" }
      responses:
        "200":
          description: Structured private preview, missing-information response or honest manual fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAIPreview" }
  /workspace/ai-drafts/{id}:
    get:
      operationId: getCustomerAIDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Workspace-owned AI preview, never an editorial publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAIPreview" }
  /workspace/ai-drafts/{id}/accept:
    post:
      operationId: acceptCustomerAIDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAISelection" }
      responses:
        "201":
          description: Exactly one private document; subsequent edits append revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
  /workspace/ai-usage:
    get:
      operationId: getCustomerAIUsage
      responses:
        "200":
          description: Real development quota and feature state, not a commercial subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAIUsage" }
  /public/discovery:
    get:
      operationId: getPublicDiscovery
      responses:
        "200":
          description: Public metadata for current releases and existing directory pages; no source files or private records
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [path, title, description, modifiedAt]
                      properties:
                        path: { type: string }
                        title: { type: string }
                        description: { type: string }
                        modifiedAt: { type: [string, "null"] }
  /public/resources:
    get:
      operationId: listReleasedResources
      tags: [public]
      responses:
        "200":
          description: Only currently eligible released non-template content.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReleasedResource" } }
  /public/resources/{slug}:
    get:
      operationId: getReleasedResource
      tags: [public]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Released guidance with its actual sources, scope and limitations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasedResource" }
        "404": { description: "Unknown, held, expired or withdrawn." }
  /public/coverage:
    get:
      operationId: getPublicCoverage
      responses:
        "200":
          description: Evidence-held coverage plan, not published regulatory guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCoverage" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /public/catalogue:
    get:
      operationId: listPublicCatalogue
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: type, schema: { type: string, enum: [all, template, guidance, article, industry, service] } }
        - { in: query, name: industry, schema: { type: string, maxLength: 80 } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: access, schema: { type: string, enum: [all, free, premium] } }
        - { in: query, name: sort, schema: { type: string, enum: [relevance, name, recently_checked] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - in: query
          name: templateIds
          description: Only the released templates with these numbers, comma-separated, up to twenty.
          schema: { type: string, maxLength: 139, pattern: "^TPL-[0-9]{2}(,TPL-[0-9]{2}){0,19}$" }
      responses:
        "200":
          description: Released public content only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CataloguePage"
        "429": { $ref: "#/components/responses/QuotaError" }
  /public/templates/{slug}:
    get:
      operationId: getReleasedTemplate
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Live eligible development template, never an unpublished master
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasedTemplate" }
        "404": { $ref: "#/components/responses/AuthError" }
  /workspace/saved-templates:
    get:
      operationId: listSavedTemplates
      responses:
        "200":
          description: Owner-scoped saved items and currently released suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedTemplates" }
        "401": { description: Sign-in required }
  /workspace/saved-templates/{id}:
    put:
      operationId: saveReleasedTemplate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Saved after current release and owner checks; no entitlement is granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedTemplates" }
        "404": { description: Release unavailable }
        "403": { description: Active owner required }
        "409": { description: Saved-item limit reached }
  /workspace/saved-templates/by-template/{templateId}:
    delete:
      operationId: unsaveTemplate
      parameters:
        - { in: path, name: templateId, required: true, schema: { type: string, maxLength: 80, pattern: "^[A-Za-z0-9_-]{1,80}$" } }
      responses:
        "200":
          description: Idempotent removal, including unavailable templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedTemplates" }
        "403": { description: Active owner required }
  /public/recommendations:
    get:
      operationId: listOperationalRecommendations
      responses:
        "200":
          description: Optional operational aids, not legal applicability recommendations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CataloguePage" }
  /workspace/templates/{id}/draft:
    post:
      operationId: createTemplateDraft
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Tenant-owned immutable first revision linked to its released template version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "404": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
  /workspace/templates/{id}/files/{format}:
    get:
      operationId: downloadReleasedTemplate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: format, required: true, schema: { type: string, enum: [docx, pdf] } }
      responses:
        "200":
          description: Private account-gated blank master; withdrawal prevents new downloads
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
  /workspace/owned-template-editions:
    get:
      operationId: listOwnedTemplateEditions
      tags: [workspace]
      responses:
        "200":
          description: Edition IDs with active, verified purchases in the signed-in workspace. Each file request checks access again.
          content:
            application/json:
              schema: { type: array, items: { type: string, format: uuid } }
        "401": { description: Sign-in required }
        "403": { description: Active workspace access required }
  /workspace/purchases:
    get:
      operationId: getCustomerPurchases
      tags: [workspace]
      responses:
        "200":
          description: Honest unavailable state until server-verified commerce and purchase records exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPurchases" }
  /workspace/orders:
    post:
      operationId: createCommerceOrder
      tags: [valo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceOrderInput" }
      responses:
        "201":
          description: A server-priced test order. Repeated requests for the same open edition and terms return its existing order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceOrder" }
        "409": { description: "The edition already has a payment or a conflicting open order, or the offer or licence is no longer current." }
  /workspace/orders/{id}/checkout:
    post:
      operationId: startCommerceCheckout
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceActionInput" }
      responses:
        "200":
          description: Validated hosted test checkout
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
        "409": { description: The edition is already purchased or another checkout is in progress. }
  /workspace/orders/{id}/refresh:
    post:
      operationId: refreshCommerceOrder
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceActionInput" }
      responses:
        "200":
          description: Authoritative server verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceOrder" }
  /workspace/orders/{id}/receipt:
    get:
      operationId: getCommerceReceipt
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Test receipt available only after server verification
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/CommerceOrder" }
                  - type: object
                    required: [notice, deliveryStatus]
                    properties:
                      notice: { type: string }
                      deliveryStatus: { type: string }
  /workspace/orders/{id}/receipt/file:
    get:
      operationId: downloadCommerceReceipt
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The order's test receipt as a PDF, made from the order's record; never publicly cached
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: "No such order in this workspace." }
        "409":
          description: "The order has no recorded verified original purchase receipt."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
        "429":
          description: "Too many files asked for in a short time."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiProblem" }
  /workspace/orders/{id}/refund:
    post:
      operationId: requestCommerceRefund
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceRefundInput" }
      responses:
        "201":
          description: Durable request, not an authorised or completed refund
          content:
            application/json:
              schema:
                type: object
                required: [reference, status]
                properties:
                  reference: { type: string }
                  status: { type: string }
  /workspace/orders/{id}/dispute-information:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOrderDisputeInformation
      responses:
        "200":
          description: Own provider dispute references and customer statements, not bank findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeInformationList" }
    post:
      operationId: saveOrderDisputeInformation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeInformationInput" }
      responses:
        "201":
          description: Customer statement and explicit sharing consent saved, not submitted to provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeInformationList" }
  /admin/disputes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFinanceDispute
      responses:
        "200":
          description: Finance-only scoped records and immutable prepared intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDispute" }
  /admin/disputes/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: prepareFinanceDispute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeIntentInput" }
      responses:
        "201":
          description: Finance-authorized intent prepared, not a provider mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDispute" }
  /admin/dispute-actions/{id}/{operation}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: operation, in: path, required: true, schema: { type: string, enum: [execute, reconcile, cancel] } }
    post:
      operationId: controlFinanceDispute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeControlInput" }
      responses:
        "200":
          description: Actual intent/provider observation state; never a claimed bank victory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDispute" }
  /admin/refunds:
    get:
      operationId: getFinanceRefunds
      tags: [admin]
      responses:
        "200":
          description: Finance-only test refunds; active managed identity and fresh MFA required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceRefunds" }
  /admin/refunds/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideFinanceRefund
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundDecisionInput" }
      responses:
        "200":
          description: Recorded decision, not provider completion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /admin/refunds/{id}/reconcile:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reconcileFinanceRefund
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceActionInput" }
      responses:
        "200":
          description: Verified provider observation or explicit unmet configuration; never assumed success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /admin/owner-prices:
    get:
      operationId: listOwnerPrices
      tags: [staff]
      summary: The published premium templates and their prices, for the development owner (ADM-006)
      description: >-
        Each published premium template from the staff library, with its open price and any price
        scheduled to start (docs/architecture/commercial-settings.md, slice 1). Read-only. Development only.
      responses:
        "200":
          description: The templates and their prices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerPricePage" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
    post:
      operationId: recordOwnerPrice
      tags: [staff]
      summary: Record the owner's price for a published premium template
      description: >-
        Refused unless `confirm` is the checksum the preview gave for exactly these terms. The template's
        open price closes when the new one starts. Recording takes no payment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerPriceRecord" }
      responses:
        "200":
          description: The price recorded, and the prices it closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerPriceRecorded" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
        "409": { description: "The template cannot be priced now, or the checksum is not of these terms" }
        "422": { description: A term is missing or malformed }
  /admin/owner-prices/previews:
    post:
      operationId: previewOwnerPrice
      tags: [staff]
      summary: The exact terms of a price and their checksum, which recording confirms
      description: Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerPriceTerms" }
      responses:
        "200":
          description: The exact terms and their checksum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerPricePreview" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
        "409": { description: The template cannot be priced now }
        "422": { description: A term is missing or malformed }
  /admin/owner-bundles:
    get:
      operationId: listOwnerBundles
      tags: [staff]
      summary: The bundles and the premium templates a bundle may hold, for the development owner (ADM-006)
      description: >-
        Each bundle's open version and any version scheduled to start, and each premium template of the
        staff library that has been released (docs/architecture/commercial-settings.md, slice 4b).
        Read-only. Development only.
      responses:
        "200":
          description: The bundles' versions and the templates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerBundlePage" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
    post:
      operationId: recordOwnerBundle
      tags: [staff]
      summary: Record the owner's version of a bundle of premium templates
      description: >-
        Refused unless `confirm` is the checksum the preview gave for exactly these terms. The bundle's open
        version closes when the new one starts. Recording takes no payment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerBundleRecord" }
      responses:
        "200":
          description: The version recorded, and the versions it closed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerBundleRecorded" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
        "409": { description: "A template cannot be in a bundle, the version cannot start then, or the checksum is not of these terms" }
        "422": { description: A term is missing or malformed }
  /admin/owner-bundles/previews:
    post:
      operationId: previewOwnerBundle
      tags: [staff]
      summary: The exact terms of a bundle's version, its templates and their checksum, which recording confirms
      description: Writes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerBundleTerms" }
      responses:
        "200":
          description: The exact terms, the templates they name and their checksum.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerBundlePreview" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
        "409": { description: A template cannot be in a bundle }
        "422": { description: A term is missing or malformed }
  /admin/owner-settings:
    get:
      operationId: listOwnerSettings
      tags: [staff]
      summary: The commercial settings and their values, for the development owner (ADM-006)
      description: >-
        Each commercial setting, with its default and any value in effect or scheduled to start
        (docs/architecture/commercial-settings.md, slice 3). Read-only. Development only.
      responses:
        "200":
          description: The settings and their values.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerSettingPage" }
        "401": { description: Sign-in required }
        "403": { description: "Only the development owner, with recent verification" }
    post:
      operationId: recordOwnerSetting
