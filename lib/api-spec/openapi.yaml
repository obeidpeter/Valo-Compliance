        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
  /admin/support-cases/{id}/action:
    post:
      operationId: actOnSupportCase
      tags: [staff]
      summary: Assign, reply to, resolve, reopen or refer a support case
      description: Replies are saved to the portal or kept internal. Nothing is emailed. A content referral grants no hold or publication authority.
