        globalAvailable: { type: boolean }
        manualFallbackAvailable: { type: boolean }
        policyNotice: { type: string }
    ReleasedResource:
      type: object
      required: [id, slug, title, kind, industrySlugs, summary, body, reviewedAt, disclosure, scope, limitations, sources]
