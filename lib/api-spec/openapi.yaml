        factsNotice: { type: string }
        sourceReviewHold: { type: string }
        releaseNotice:
          type: string
          description: How the rule behind this item was released (EDP-008). A result saved before the notice was recorded has none.
        sourceLinkedTaskEligible: { type: boolean }
        missingAnswerStates: { type: array, items: { $ref: "#/components/schemas/MissingAnswerState" } }
        missingFacts: { type: array, items: { type: string } }
        matchedFacts: { type: array, items: { type: string } }
        nextStep: { type: string }
        jurisdiction: { $ref: "#/components/schemas/RuleJurisdiction" }
        sources: { type: array, items: { $ref: "#/components/schemas/RuleSource" } }
        relatedTemplateIds: { type: array, items: { type: string } }
        officialRoute:
          $ref: "#/components/schemas/RequirementRoute"
        figures:
          type: array
          description: Each fee, deadline, rate or threshold the item's rule records, with the source it rests on (CMP-006). Absent when the rule records none, and in a result saved before figures were recorded.
          items: { $ref: "#/components/schemas/RequirementFigure" }
        sourceCheckedAt:
          type: string
          description: When the rule's sources were last checked (CMP-004). Absent in a result saved before dates were recorded.
        publication:
          type: object
          description: How the rule was released and when, from its release record (CMP-004). Absent for a test rule, and in a result saved before dates were recorded.
          required: [route, publishedAt]
          properties:
            route: { type: string, enum: [owner_signoff, editorial_release] }
            publishedAt: { type: string }
    RequirementFigure:
      type: object
      required: [kind, words, sourceId]
      properties:
        kind: { type: string, enum: [fee, deadline, rate, threshold] }
        words: { type: string, description: "In the words of the passage of the item's source it rests on." }
        sourceId: { type: string, description: "The id of one of the item's sources." }
    CheckerRuleInUse:
      type: object
      required: [ruleId, ruleVersion, title, family]
      properties:
        ruleId: { type: string }
        ruleVersion: { type: integer }
        title: { type: string }
        family:
          type: [string, "null"]
          enum: [businessName, tax, privacy, product, null]
          description: The rule questions the rule reads, or null for a rule that reads only the check's own questions.
    CheckerRulesInUse:
      type: object
      required: [asOfDate, rules]
      properties:
        asOfDate: { type: string }
        rules: { type: array, items: { $ref: "#/components/schemas/CheckerRuleInUse" } }
    OfficialRoute:
      type: object
      required: [title, url]
      properties:
        title: { type: string }
        url: { type: string }
    AssessmentResult:
      type: object
      required: [schemaVersion, asOfDate, rulesetVersion, items, unanswered, gaps, recommendedTemplateIds, officialRoutes, notice, sourceBackedRecommendations, resultHash]
      properties:
        schemaVersion: { type: string }
        asOfDate: { type: string }
        rulesetVersion: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/AssessmentItem" } }
        unanswered: { type: array, items: { type: string } }
        gaps: { type: array, items: { type: string } }
        recommendedTemplateIds: { type: array, items: { type: string } }
        officialRoutes: { type: array, items: { $ref: "#/components/schemas/OfficialRoute" } }
        notice: { type: string }
        sourceBackedRecommendations: { type: integer }
        resultHash: { type: string }
    SavedAssessment:
      type: object
      required: [id, profileRevision, facts, result, createdAt]
      properties:
        id: { type: string }
        profileRevision: { type: [integer, "null"] }
        facts: { $ref: "#/components/schemas/CheckerFacts" }
        result: { $ref: "#/components/schemas/AssessmentResult" }
        createdAt: { type: string }
        ruleChanges:
          type: array
          maxItems: 100
          description: When the saved result is read on its own, each change since to a rule version it lists, from the workspace's rule notices (docs/architecture/rule-changes.md, slice 3). Absent when none of its rule versions changed. The result itself is unchanged.
          items: { $ref: "#/components/schemas/RuleChange" }
    AssessmentComparison:
      type: object
      required: [previousId, currentId, changedFacts, addedRuleIds, removedRuleIds, changedRuleIds, explanations]
      properties:
        previousId: { type: string }
        currentId: { type: string }
        changedFacts: { type: array, items: { type: string } }
        addedRuleIds: { type: array, items: { type: string } }
        removedRuleIds: { type: array, items: { type: string } }
        changedRuleIds: { type: array, items: { type: string } }
        explanations:
          description: Why each added, removed or changed rule differs between the two assessments (CMP-005).
          type: array
          items: { $ref: "#/components/schemas/AssessmentChange" }
    AssessmentChange:
      type: object
      required: [ruleId, title, change, previousVersion, currentVersion, previousLabel, currentLabel, changedFacts]
      properties:
        ruleId: { type: string }
        title: { type: string }
        change: { type: string, enum: [added, removed, changed] }
        previousVersion: { type: [integer, "null"] }
        currentVersion: { type: [integer, "null"] }
        previousLabel: { type: [string, "null"] }
        currentLabel: { type: [string, "null"] }
        changedFacts:
          description: The changed answers this rule's result used or still needs.
          type: array
          items: { type: string }
    AuditHistoryPage:
      type: object
      additionalProperties: false
      required: [kind, entries, page, pageSize, total, notice]
      properties:
        kind: { type: string, enum: [access, safety, prices, refunds, counts] }
        entries:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AuditHistoryEntry" }
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        notice: { type: string }
    AuditHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, at, actor, action, object, reason]
      properties:
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actor: { type: string, maxLength: 300 }
        action: { type: string, maxLength: 300 }
        object: { type: string, maxLength: 300 }
        reason:
          description: Null where the history keeps none, or where it may hold a customer's own words.
          type: [string, "null"]
          maxLength: 2000
    VerifyStaffRoleTargetInput:
      type: object
      additionalProperties: false
      required: [identityId]
      properties:
        identityId: { type: string, pattern: '^user_[A-Za-z0-9_-]+$', maxLength: 128 }
    StaffRoleAssignment:
      type: object
      required: [id, identityId, role, active, grantMode, expiresAt, version, grantedBy, grantedAt, reason]
      properties:
        id: { type: string, format: uuid }
        identityId: { type: string }
        role: { type: string, enum: [content, support, finance, system, privacy, reviewer] }
        active: { type: boolean }
        grantMode: { type: string, enum: [permanent, break_glass] }
        expiresAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
        grantedBy: { type: string }
        grantedAt: { type: string, format: date-time }
        reason: { type: string }
    StaffRoleChangeReceipt:
      type: object
      required: [id, requestKey, actorId, assignmentId, targetIdentityId, action, role, reason, incidentReference, before, after, createdAt]
      properties:
        id: { type: string, format: uuid }
        requestKey: { type: string, format: uuid }
        actorId: { type: string }
        assignmentId: { type: string, format: uuid }
        targetIdentityId: { type: string }
        action: { type: string, enum: [grant, revoke] }
        role: { type: string }
        reason: { type: string }
        incidentReference: { type: [string, "null"] }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    StaffRoleChangeInput:
      type: object
      additionalProperties: false
      required: [requestKey, identityId, role, action, expectedVersion, reason, acknowledgement]
      properties:
        requestKey: { type: string, format: uuid }
        identityId: { type: string, pattern: '^user_[A-Za-z0-9_-]+$', maxLength: 128 }
        role: { type: string, enum: [content, support, finance, system, privacy, reviewer] }
        action: { type: string, enum: [grant, revoke] }
        expectedVersion: { type: integer, minimum: 0 }
        reason: { type: string, minLength: 20, maxLength: 1000 }
        acknowledgement: { type: boolean, enum: [true] }
        grantMode: { type: string, enum: [permanent, break_glass] }
        durationMinutes: { type: integer, minimum: 5, maximum: 60 }
        incidentReference: { type: string, minLength: 5, maxLength: 200 }
    StaffRoleAdministration:
      type: object
      required: [assignments, changes, notice]
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/StaffRoleAssignment" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/StaffRoleChangeReceipt" }
        notice: { type: string }
    StaffOperations:
      type: object
      required: [area, notice, records]
      properties:
        area: { type: string, enum: [content, support, finance, system] }
        notice: { type: string }
        records: { type: array, items: { type: object, additionalProperties: true } }
        preparedCandidates:
          description: >-
            Content area only. Template candidates prepared for their two reviews (decision 0014), most
            recent first. A candidate is a private artifact until its reviews are checked, so it is not
            among the content versions.
          type: array
          items: { $ref: "#/components/schemas/StaffPreparedCandidate" }
    StaffPreparedCandidate:
      type: object
      additionalProperties: false
      required: [artifactId, artifactHash, versionId, templateId, version, preparedAt, reviewBy, state, savedStatus]
      properties:
        artifactId: { type: string, format: uuid }
        artifactHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        versionId: { type: string, format: uuid }
        templateId: { type: string }
        version: { type: integer, minimum: 1 }
        preparedAt: { type: string, format: date-time }
        reviewBy: { type: string, format: date-time }
        state:
          description: >-
            awaiting_reviews until its version is saved; saved once it is, with that version's status;
            expired after its review date; version_taken when another candidate was saved under its
            version number first.
          type: string
          enum: [awaiting_reviews, saved, expired, version_taken]
        savedStatus: { type: [string, "null"], enum: [candidate, held, published, withdrawn, null] }
    AccessSupportInput:
      type: object
