            schema: { $ref: "#/components/schemas/CommerceOrderInput" }
      responses:
        "201":
          description: Server-priced test order; not a payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceOrder" }
  /workspace/orders/{id}/checkout:
