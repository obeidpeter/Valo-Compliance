openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /public/access-support:
    post:
      operationId: requestAccessSupport
      tags: [support]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessSupportInput" }
      responses:
        "201":
          description: Durably saved without looking up or disclosing an account; not an email-delivery confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessSupportAck" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /public/resources:
    get:
      operationId: listReleasedResources
      tags: [public]
      responses:
        "200":
          description: Only currently eligible released non-template content.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReleasedResource" } }
  /public/resources/{slug}:
    get:
      operationId: getReleasedResource
      tags: [public]
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Released guidance with its actual sources, scope and limitations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasedResource" }
        "404": { description: "Unknown, held, expired or withdrawn." }
  /workspace/account:
    get:
      operationId: getCustomerAccount
      tags: [workspace]
      responses:
        "200":
          description: Actual saved privacy requests for the authorised workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAccount" }
  /workspace/privacy-requests:
    post:
      operationId: requestCustomerPrivacy
      tags: [workspace]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyRequestInput" }
      responses:
        "201":
          description: Saved request; no deletion or provider-wide fulfilment is claimed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessSupportAck" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/data-export:
    get:
      operationId: downloadWorkspaceData
      tags: [workspace]
      responses:
        "200":
          description: Private structured workspace data; identity/provider-wide export is separately requested.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceDataExport" }
  /workspace/data-exports:
    get:
      operationId: listWorkspaceDataExports
      responses:
        "200":
          description: Current user's durable private exports.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/WorkspaceExportJob"}}
    post:
      operationId: createWorkspaceDataExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceExportRequest"
      responses:
        "201":
          description: Persistent export identity; not proof of completed preparation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceExportJob"}
  /workspace/data-exports/{id}/cancel:
    post:
      operationId: cancelWorkspaceDataExport
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Discarded with private cleanup scheduled; not a processor erasure claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceExportJob"}
  /workspace/data-exports/{id}/download:
    get:
      operationId: downloadWorkspaceDataArtifact
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Complete verified private JSON artifact, never a partial preparation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceDataExport"}
        "206":
          description: Authorized byte range of an already complete verified artifact.
          content:
            application/octet-stream:
              schema: {type: string}
  /workspace/purchases:
    get:
      operationId: getCustomerPurchases
      tags: [workspace]
      responses:
        "200":
          description: Honest unavailable state until server-verified commerce and purchase records exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerPurchases" }
  /workspace/orders:
    post:
      operationId: createCommerceOrder
      tags: [valo]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceOrderInput" }
      responses:
        "201":
          description: Server-priced test order; not a payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceOrder" }
  /workspace/orders/{id}/checkout:
    post:
      operationId: startCommerceCheckout
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceActionInput" }
      responses:
        "200":
          description: Validated hosted test checkout
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string }
  /workspace/orders/{id}/refresh:
    post:
      operationId: refreshCommerceOrder
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceActionInput" }
      responses:
        "200":
          description: Authoritative server verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommerceOrder" }
  /workspace/orders/{id}/receipt:
    get:
      operationId: getCommerceReceipt
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Test receipt available only after server verification
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/CommerceOrder" }
                  - type: object
                    required: [notice, deliveryStatus]
                    properties:
                      notice: { type: string }
                      deliveryStatus: { type: string }
  /workspace/orders/{id}/refund:
    post:
      operationId: requestCommerceRefund
      tags: [valo]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceRefundInput" }
      responses:
        "201":
          description: Durable request, not an authorised or completed refund
          content:
            application/json:
              schema:
                type: object
                required: [reference, status]
                properties:
                  reference: { type: string }
                  status: { type: string }
  /admin/operations:
    get:
      operationId: getStaffOperations
      tags: [admin]
      parameters:
        - { name: area, in: query, required: true, schema: { type: string, enum: [content, support, finance, system] } }
      responses:
        "200":
          description: Role-separated read-only operations, active managed session and recent MFA required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffOperations" }
        "403": { description: Missing staff permission or recent MFA; no self-enrolment route. }
  /workspace/orders/{id}/dispute-information:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOrderDisputeInformation
      responses:
        "200":
          description: Own provider dispute references and customer statements, not bank findings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeInformationList" }
    post:
      operationId: saveOrderDisputeInformation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeInformationInput" }
      responses:
        "201":
          description: Customer statement and explicit sharing consent saved, not submitted to provider
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeInformationList" }
  /admin/disputes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getFinanceDispute
      responses:
        "200":
          description: Finance-only scoped records and immutable prepared intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDispute" }
  /admin/disputes/{id}/actions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: prepareFinanceDispute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeIntentInput" }
      responses:
        "201":
          description: Finance-authorized intent prepared, not a provider mutation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDispute" }
  /admin/dispute-actions/{id}/{operation}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: operation, in: path, required: true, schema: { type: string, enum: [execute, reconcile, cancel] } }
    post:
      operationId: controlFinanceDispute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeControlInput" }
      responses:
        "200":
          description: Actual intent/provider observation state; never a claimed bank victory
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceDispute" }
  /admin/refunds:
    get:
      operationId: getFinanceRefunds
      tags: [admin]
      responses:
        "200":
          description: Finance-only test refunds; active managed identity and fresh MFA required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceRefunds" }
  /admin/refunds/{id}/decision:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: decideFinanceRefund
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundDecisionInput" }
      responses:
        "200":
          description: Recorded decision, not provider completion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /admin/refunds/{id}/reconcile:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: reconcileFinanceRefund
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CommerceActionInput" }
      responses:
        "200":
          description: Verified provider observation or explicit unmet configuration; never assumed success.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefundRecord" }
  /v1/documents/{id}/exports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDocumentExports
      tags: [workspace]
      responses:
        "200":
          description: Authorised saved-revision export jobs; private keys are never returned.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ExportJob" } }
    post:
      operationId: createDocumentExport
      tags: [workspace]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportInput" }
      responses:
        "202":
          description: "Durably recorded export request, or the existing matching job."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "409": { description: Key reused for different content or conflicting operation. }
        "422": { description: Invalid fields or missing deliberate draft acknowledgement. }
  /v1/exports/{id}/retry:
    post:
      operationId: retryDocumentExport
      tags: [workspace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRetryInput" }
      responses:
        "202":
          description: "Retry recorded, or the existing job state."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
  /v1/exports/{id}/file:
    get:
      operationId: downloadDocumentExport
      tags: [workspace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "Authorised integrity-checked private file, never publicly cached."
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "404": { description: "Missing, unavailable or unauthorised file." }
  /public/coverage:
    get:
      operationId: getPublicCoverage
      responses:
        "200":
          description: Evidence-held coverage plan, not published regulatory guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCoverage" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /development/source-evidence:
    get:
      operationId: getSourceEvidence
      responses:
        "200":
          description: Development-only original reference leads, actual retrieval state and unapproved policy proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceEvidenceRegister"
        "404":
          description: Not available outside development
  /development/proof:
    get:
      operationId: getProofRegister
      responses:
        "200":
          description: Original UAT packs, gates and non-waivable release controls; not acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofRegister" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /development/content:
    get:
      operationId: getContentRegister
      responses:
        "200":
          description: Development-only held content traceability, never approved public content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentRegister" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /development/requirements:
    get:
      operationId: getRequirementsRegister
      responses:
        "200":
          description: Development-only requirements and conflict register, never customer data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementsRegister" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /public/catalogue:
    get:
      operationId: listPublicCatalogue
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: type, schema: { type: string, enum: [all, template, guidance, service] } }
        - { in: query, name: industry, schema: { type: string, maxLength: 80 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Released public content only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CataloguePage"
        "429": { $ref: "#/components/responses/QuotaError" }
  /public/templates/{slug}:
    get:
      operationId: getReleasedTemplate
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Live eligible development template, never an unpublished master
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReleasedTemplate" }
        "404": { $ref: "#/components/responses/AuthError" }
  /public/recommendations:
    get:
      operationId: listOperationalRecommendations
      responses:
        "200":
          description: Optional operational aids, not legal applicability recommendations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CataloguePage" }
  /workspace/templates/{id}/draft:
    post:
      operationId: createTemplateDraft
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "201":
          description: Tenant-owned immutable first revision linked to its released template version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "404": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
  /workspace/templates/{id}/files/{format}:
    get:
      operationId: downloadReleasedTemplate
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: format, required: true, schema: { type: string, enum: [docx, pdf] } }
      responses:
        "200":
          description: Private account-gated blank master; withdrawal prevents new downloads
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
  /public/status:
    get:
      operationId: getBuildStatus
      responses:
        "200":
          description: Factual development release status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStatus"
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Server resolved owner workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/profile:
    put:
      operationId: saveBusinessProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Versioned business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/documents:
    get:
      operationId: listDocuments
      responses:
        "200":
          description: Private business drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Saved manual business draft, not a published template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/documents/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDocument
      responses:
        "200":
          description: Latest canonical saved revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
    patch:
      operationId: saveDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Newly appended immutable revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /workspace/documents/{id}/revisions:
    get:
      operationId: listDocumentRevisions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable historical revisions scoped to the workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/support:
    post:
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Ticket durably saved, no appointment or dispatch claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketReceipt" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /workspace/ai-drafts:
    post:
      operationId: createCustomerAIDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAIInput" }
      responses:
        "200":
          description: Structured private preview, missing-information response or honest manual fallback
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAIPreview" }
  /workspace/ai-drafts/{id}:
    get:
      operationId: getCustomerAIDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Workspace-owned AI preview, never an editorial publication
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAIPreview" }
  /workspace/ai-drafts/{id}/accept:
    post:
      operationId: acceptCustomerAIDraft
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerAISelection" }
      responses:
        "201":
          description: Exactly one private document; subsequent edits append revisions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
  /workspace/ai-usage:
    get:
      operationId: getCustomerAIUsage
      responses:
        "200":
          description: Real development quota and feature state, not a commercial subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerAIUsage" }
  /checker/preview:
    post:
      operationId: previewAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentInput" }
      responses:
        "200":
          description: Ephemeral assessment; inputs are not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResult" }
  /workspace/checker/preview:
    post:
      operationId: previewWorkspaceAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssessmentInput" }
      responses:
        "200":
          description: Ephemeral assessment; inputs are not saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentResult" }
  /workspace/assessments:
    get:
      operationId: listAssessments
      responses:
        "200":
          description: Workspace assessment history, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SavedAssessment" } }
    post:
      operationId: createAssessment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedAssessmentInput" }
      responses:
        "201":
          description: Immutable consented assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedAssessment" }
  /workspace/assessments/{id}:
    get:
      operationId: getAssessment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Workspace-owned assessment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedAssessment" }
  /workspace/assessments/{id}/compare/{previousId}:
    get:
      operationId: compareAssessments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: previousId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Comparison preserves both assessments and all tasks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssessmentComparison" }
  /workspace/tasks/page:
    get:
      operationId: listTasksPage
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { in: query, name: filter, schema: { type: string, enum: [open, done, all], default: open } }
      responses:
        "200":
          description: Tenant-scoped filtered page and actual database totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
  /workspace/tasks:
    get:
      operationId: listTasks
      responses:
        "200":
          description: Workspace-owned tasks
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkspaceTask" } }
    post:
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: Saved task, not a regulator acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTask" }
  /workspace/tasks/{id}:
    patch:
      operationId: updateTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Revision-safe task update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceTask" }
    delete:
      operationId: deleteTask
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskArchiveInput" }
      responses:
        "204": { description: Task archived; reminders cancelled }
  /workspace/reminder-preferences:
    get:
      operationId: getReminderPreferences
      responses:
        "200":
          description: Current dispatch-time preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
    put:
      operationId: saveReminderPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderPreferencesInput" }
      responses:
        "200":
          description: Preference version saved independently of marketing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
  /workspace/reminders:
    get:
      operationId: listReminders
      responses:
        "200":
          description: Actual schedule and delivery status; held is not sent
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ReminderRecord" } }
  /workspace/privacy-cases:
    get:
      operationId: listPrivacyCases
      responses:
        "200":
          description: Owner-scoped requests with actual processing state, not assumed fulfilment
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PrivacyCase" } }
        "401": { $ref: "#/components/responses/AuthError" }
  /workspace/privacy-cases/{id}/respond:
    post:
      operationId: respondPrivacyCase
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyInformation"
      responses:
        "200":
          description: Information saved to this case, separately from identity verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyCaseDetail" }
        "401": { $ref: "#/components/responses/AuthError" }
  /workspace/privacy-cases/{id}:
    get:
      operationId: getPrivacyCase
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Request and its audited processing steps
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyCaseDetail" }
        "404": { $ref: "#/components/responses/AuthError" }
  /workspace/privacy-cases/{id}/verify:
    post:
      operationId: verifyPrivacyCase
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyCaseConfirmation" }
      responses:
        "200":
          description: Ownership verified against the active managed identity and workspace; no fulfilment implied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyCaseDetail" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /workspace/privacy-cases/{id}/cancel:
    post:
      operationId: cancelPrivacyCase
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyCaseConfirmation" }
      responses:
        "200":
          description: A not-yet-destructive request was cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyCaseDetail" }
        "409": { $ref: "#/components/responses/ConflictError" }
  /workspace/privacy-cases/{id}/result:
    get:
      operationId: downloadPrivacyCaseResult
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Private prepared result, with its exact included systems and remaining exclusions
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/AuthError" }
  /admin/privacy-cases:
    get:
      operationId: listStaffPrivacyCases
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Privacy-role and fresh-MFA gated queue
          content:
            application/json:
              schema:
                type: object
                required: [items, page, total, pageSize]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PrivacyCase" } }
                  page: { type: integer }
                  total: { type: integer }
                  pageSize: { type: integer }
        "403": { $ref: "#/components/responses/AuthError" }
  /admin/privacy-cases/{id}:
    get:
      operationId: getStaffPrivacyCase
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Fresh-MFA privacy staff read-only case inspection and currently permitted operations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyCaseDetail" }
        "401": { $ref: "#/components/responses/AuthError" }
  /admin/privacy-cases/{id}/action:
    post:
      operationId: actOnStaffPrivacyCase
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrivacyStaffAction" }
      responses:
        "200":
          description: Audited permitted action; requests and pending provider steps are never reported as confirmed outcomes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivacyCaseDetail" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/ConflictError" }
components:
  responses:
    WriteLimit:
      description: Durable write ceiling reached; saved data is unchanged and unsaved input must be retained
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until the limiting database window resets }
      content:
        application/json:
          schema:
            type: object
            required: [code, error, retryAfter]
            properties:
              code: { type: string, enum: [WRITE_LIMIT_REACHED] }
              error: { type: string }
              retryAfter: { type: integer, minimum: 1 }
    QuotaError:
      description: Read ceiling reached; retry after the indicated seconds without changing saved work
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the current database window resets }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiProblem" }
    ConflictError:
      description: The request version or processing state changed; reload before retrying
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              currentRevision: { type: integer }
              requestId: { type: string }
    AuthError:
      description: Validation, access or concurrency error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    AccessSupportInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, email, topic, message]
      properties:
        idempotencyKey: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        topic: { type: string, enum: [account_access, general, content_issue] }
        message: { type: string, minLength: 20, maxLength: 2000 }
        website: { type: string, maxLength: 0 }
    AccessSupportAck:
      type: object
      required: [reference, message, delivery]
      properties:
        reference: { type: string }
        message: { type: string }
        delivery: { type: string, enum: [not_dispatched] }
    ReleasedResource:
      type: object
      required: [id, slug, title, kind, industrySlugs, summary, body, reviewedAt, disclosure, scope, limitations, sources]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        kind: { type: string, enum: [guidance, guide, industry_pack, location_pack] }
        industrySlugs: { type: array, items: { type: string } }
        summary: { type: string }
        body: { type: string }
        reviewedAt: { type: string }
        disclosure: { type: string }
        scope: { type: string }
        limitations: { type: string }
        sources: { type: array, items: { $ref: "#/components/schemas/PublicSourceReference" } }
    PublicSourceReference:
      type: object
      required: [url, title, locator]
      properties:
        url: { type: string }
        title: { type: string }
        locator: { type: string }
    PrivacyRequestInput:
      type: object
      additionalProperties: false
      required: [kind, message, acknowledgement]
      properties:
        kind: { type: string, enum: [correction, export, deletion] }
        message: { type: string, minLength: 10, maxLength: 1500 }
        acknowledgement: { type: boolean, enum: [true] }
        idempotencyKey: { type: string, format: uuid }
    PrivacyCaseConfirmation:
      type: object
      additionalProperties: false
      required: [expectedVersion, acknowledgement]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        acknowledgement: { type: boolean, enum: [true] }
    PrivacyCase:
      type: object
      required: [id, workspaceId, reference, kind, message, status, version, assigned, verifiedAt, resultAvailable, resultScope, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        reference: { type: string }
        kind: { type: string, enum: [correction, export, deletion] }
        message: { type: string }
        status: { type: string, enum: [awaiting_verification, verified, assigned, in_progress, needs_information, held, partially_fulfilled, fulfilled, rejected, cancelled, failed] }
        version: { type: integer }
        assigned: { type: boolean }
        verifiedAt: { type: string, nullable: true }
        resultAvailable: { type: boolean }
        resultScope: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    PrivacyInformation:
      type: object
      additionalProperties: false
      required: [expectedVersion, message]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        message: { type: string, minLength: 10, maxLength: 4000 }
    PrivacyCaseDetail:
      type: object
      required: [request, events, steps, messages, mayRespond]
      properties:
        request: { $ref: "#/components/schemas/PrivacyCase" }
        mayRespond: { type: boolean }
        availableActions: { type: array, items: { type: string } }
        messages:
          type: array
          items:
            type: object
            required: [id, body, createdAt]
            properties:
              id: { type: string, format: uuid }
              body: { type: string }
              createdAt: { type: string }
        events:
          type: array
          items:
            type: object
            required: [sequence, action, actorType, reason, createdAt]
            properties:
              sequence: { type: integer }
              action: { type: string }
              actorType: { type: string, enum: [customer, staff, worker] }
              reason: { type: string }
              createdAt: { type: string }
        steps:
          type: array
          items:
            type: object
            required: [system, status, detail]
            properties:
              system: { type: string }
              status: { type: string, enum: [pending, running, confirmed, held, failed, not_applicable] }
              detail: { type: string }
    PrivacyStaffAction:
      type: object
      additionalProperties: false
      required: [expectedVersion, action, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        action: { type: string, enum: [claim, request_information, hold, release_hold, reject, prepare_export, record_correction, start_erasure, resume_erasure] }
        reason: { type: string, minLength: 10, maxLength: 1000 }
        profileVersionId: { type: string, format: uuid }
        acknowledgement: { type: boolean }
    CustomerAccount:
      type: object
      required: [workspaceId, privacyRequests]
      properties:
        workspaceId: { type: string, format: uuid }
        privacyRequests:
          type: array
          items: { $ref: "#/components/schemas/PrivacyRequestRecord" }
    PrivacyRequestRecord:
      type: object
      required: [reference, request, status, createdAt]
      properties:
        reference: { type: string }
        request: { type: string }
        status: { type: string }
        createdAt: { type: string }
    WorkspaceExportRequest:
      type: object
      required: [requestKey]
      additionalProperties: false
      properties:
        requestKey: {type: string, format: uuid}
    WorkspaceExportJob:
      type: object
      required: [id, status, attempts, createdAt, expiresAt, snapshotAt, size, counts, errorCode, notice]
      properties:
        id: {type: string, format: uuid}
        status: {type: string, enum: [queued, preparing, interrupted, ready, cancelled, expired]}
        attempts: {type: integer}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        snapshotAt: {type: string, nullable: true}
        size: {type: number, nullable: true}
        counts: {type: object, additionalProperties: {type: integer}, nullable: true}
        errorCode: {type: string, nullable: true}
        notice: {type: string}
    WorkspaceDataExport:
      type: object
      required: [schemaVersion, exportedAt, workspaceId, scope, data]
      properties:
        schemaVersion: { type: integer }
        exportedAt: { type: string }
        workspaceId: { type: string }
        scope: { type: string }
        data: { type: object, additionalProperties: true }
    CustomerPurchases:
      type: object
      required: [available, message, orders, products, livePaymentsEnabled]
      properties:
        available: { type: boolean }
        message: { type: string }
        livePaymentsEnabled: { type: boolean }
        orders: { type: array, items: { $ref: "#/components/schemas/CommerceOrder" } }
        products:
          type: array
          items:
            type: object
            required: [id, title, amountKobo, currency, licenceVersion, licenceText, taxTreatment]
            properties:
              id: { type: string }
              title: { type: string }
              amountKobo: { type: integer }
              currency: { type: string }
              licenceVersion: { type: string }
              licenceText: { type: string }
              taxTreatment: { type: string }
    CommerceOrderInput:
      type: object
      required: [priceId, acceptedLicenceVersion, requestKey]
      properties:
        priceId: { type: string, format: uuid }
        acceptedLicenceVersion: { type: string, minLength: 1, maxLength: 100 }
        requestKey: { type: string, format: uuid }
    CommerceRefundInput:
      type: object
      additionalProperties: false
      required: [reason, amountKobo, requestKey, acceptedPolicyVersion]
      properties:
        reason: { type: string, minLength: 10, maxLength: 1500 }
        amountKobo: { type: integer, minimum: 1, maximum: 2147483647 }
        requestKey: { type: string, format: uuid }
        acceptedPolicyVersion: { type: string, enum: [test-refund-v1] }
    RefundDecisionInput:
      type: object
      additionalProperties: false
      required: [decision, reason, expectedVersion]
      properties:
        decision: { type: string, enum: [approve, reject] }
        reason: { type: string, minLength: 10, maxLength: 1500 }
        expectedVersion: { type: integer, minimum: 1 }
    RefundRecord:
      type: object
      required: [id, orderId, amountKobo, status, reference, reason, decisionReason, policyVersion, version, attempts, createdAt, checkedAt, completedAt, failure]
      properties:
        id: { type: string }
        orderId: { type: string }
        amountKobo: { type: [integer, "null"] }
        status: { type: string }
        reference: { type: string }
        reason: { type: string }
        decisionReason: { type: [string, "null"] }
        policyVersion: { type: string }
        version: { type: integer }
        attempts: { type: integer }
        createdAt: { type: string }
        checkedAt: { type: [string, "null"] }
        completedAt: { type: [string, "null"] }
        failure: { type: [string, "null"] }
    DisputeInformationInput:
      type: object
      additionalProperties: false
      required: [disputeId, requestKey, customerName, customerPhone, serviceDetails, consentVersion]
      properties:
        disputeId: { type: string, format: uuid }
        requestKey: { type: string, format: uuid }
        customerName: { type: string, minLength: 1, maxLength: 150 }
        customerPhone: { type: string, minLength: 5, maxLength: 40 }
        serviceDetails: { type: string, minLength: 10, maxLength: 2000 }
        deliveryAddress: { type: string, maxLength: 500 }
        deliveryDate: { type: string, format: date }
        consentVersion: { type: string, enum: [test-dispute-information-v1] }
    DisputeInformationList:
      type: object
      required: [disputes, information, notice]
      properties:
        disputes: { type: array, items: { type: object, additionalProperties: true } }
        information: { type: array, items: { type: object, additionalProperties: true } }
        notice: { type: string }
    DisputeIntentInput:
      type: object
      additionalProperties: false
      required: [kind, requestKey, message]
      properties:
        kind: { type: string, enum: [upload_receipt, submit_evidence, merchant_decision] }
        requestKey: { type: string, format: uuid }
        message: { type: string, minLength: 10, maxLength: 1500 }
        informationId: { type: string, format: uuid }
        resolution: { type: string, enum: [merchant-accepted, declined] }
        amountKobo: { type: integer, minimum: 0, maximum: 2147483647 }
    DisputeControlInput:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    DisputeActionRecord:
      type: object
      required: [id, kind, status, version, attempts, payload, result, failure]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string }
        version: { type: integer }
        attempts: { type: integer }
        payload: { type: object, additionalProperties: true }
        result: { type: object, nullable: true, additionalProperties: true }
        failure: { type: string, nullable: true }
    FinanceDispute:
      type: object
      required: [id, orderReference, amountKobo, status, resolution, actions, information, executionEnabled, policy]
      properties:
        id: { type: string }
        orderReference: { type: string }
        amountKobo: { type: integer }
        status: { type: string }
        resolution: { type: string, nullable: true }
        actions: { type: array, items: { $ref: "#/components/schemas/DisputeActionRecord" } }
        information: { type: array, items: { type: object, additionalProperties: true } }
        executionEnabled: { type: boolean }
        policy: { type: string }
        history: { type: array, items: { type: object, additionalProperties: true } }
    FinanceRefunds:
      type: object
      required: [refunds, disputes, policy]
      properties:
        refunds: { type: array, items: { $ref: "#/components/schemas/RefundRecord" } }
        disputes: { type: array, items: { type: object, additionalProperties: true } }
        policy: { type: string }
    CommerceActionInput:
      type: object
      additionalProperties: false
      properties: {}
    CommerceOrder:
      type: object
      required: [id, reference, title, amountKobo, currency, status, createdAt, lastCheckedAt, licenceVersion, licenceText, taxTreatment, contentVersionId, refundStatus, receiptReference, refunds, refundableKobo, refundedKobo, refundPolicy, disputeStatus]
      properties:
        id: { type: string }
        reference: { type: string }
        title: { type: string }
        amountKobo: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [created, pending, abandoned, failed, verified_success, needs_review, reversed] }
        createdAt: { type: string }
        lastCheckedAt: { type: string, nullable: true }
        licenceVersion: { type: string }
        licenceText: { type: string }
        taxTreatment: { type: string }
        contentVersionId: { type: string }
        refundStatus: { type: string, nullable: true }
        receiptReference: { type: string, nullable: true }
        refunds: { type: array, items: { $ref: "#/components/schemas/RefundRecord" } }
        refundableKobo: { type: integer }
        refundedKobo: { type: integer }
        refundPolicy: { type: string }
        disputeStatus: { type: [string, "null"] }
    StaffOperations:
      type: object
      required: [area, notice, records]
      properties:
        area: { type: string, enum: [content, support, finance, system] }
        notice: { type: string }
        records: { type: array, items: { type: object, additionalProperties: true } }
    CustomerAITask:
      type: string
      enum: [invoice, quotation, payment_reminder, business_proposal]
    FinancialLine:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPriceKobo]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: string, pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,3})?$" }
        unitPriceKobo: { type: string, pattern: "^[0-9]{1,24}$" }
        currency: { type: string, minLength: 3, maxLength: 3 }
    FinancialInput:
      type: object
      additionalProperties: false
      required: [kind, lines, taxAmountKobo, taxLabel, discountKobo, amountDueKobo]
      properties:
        kind: { $ref: "#/components/schemas/CustomerAITask" }
        lines: { type: array, maxItems: 40, items: { $ref: "#/components/schemas/FinancialLine" } }
