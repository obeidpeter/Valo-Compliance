        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
components:
  responses:
    WriteLimit:
      description: Durable write ceiling reached; saved data is unchanged and unsaved input must be retained
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until the limiting database window resets }
      content:
        application/json:
          schema:
            type: object
            required: [code, error, retryAfter]
            properties:
              code: { type: string, enum: [WRITE_LIMIT_REACHED] }
              error: { type: string }
              retryAfter: { type: integer, minimum: 1 }
    QuotaError:
      description: Read ceiling reached; retry after the indicated seconds without changing saved work
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the current database window resets }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiProblem" }
    ConflictError:
      description: The request version or processing state changed; reload before retrying
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              currentRevision: { type: integer }
              requestId: { type: string }
    AuthError:
      description: Validation, access or concurrency error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    RuleChange:
      type: object
      additionalProperties: false
      required: [ruleId, version, kind, replacementVersion, reason, changedAt]
      properties:
        ruleId: { type: string }
        version: { type: integer, description: "The version that changed: the one a saved result lists, or a task was made from." }
        kind: { type: string, enum: [replaced, withdrawn] }
        replacementVersion: { type: [integer, "null"], description: "The version that replaced it, for a replaced version." }
        reason: { type: string, description: "What changed, or why it was withdrawn, as the person who made the change wrote it." }
        changedAt: { type: string, description: "When the version was replaced or withdrawn, as an ISO 8601 time." }
    RequirementRoute:
      type: object
      description: The authority's own official page for a requirement, as its rule records it. Absent when the rule records none, and in a result saved before routes were recorded.
      required: [authority, url]
      properties:
        authority: { type: string }
        url: { type: string }
    TemplateOffer:
      type: object
      required: [id, title, amountKobo, currency, licenceVersion, licenceText, taxTreatment]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        amountKobo: { type: integer }
        currency: { type: string }
        licenceVersion: { type: string }
        licenceText: { type: string }
        taxTreatment: { type: string }
    PublicSourceReference:
      type: object
      required: [url, title, locator]
      properties:
        url: { type: string }
        title: { type: string }
        locator: { type: string }
        issuingBody: { type: string, description: "The body that issued the text, as the source check a staff-library guide was released on recorded it (docs/architecture/guidance-record.md). Absent where it did not." }
        effectiveFrom: { type: string, description: "For an Act or a regulator's document, the day its text took effect, as an ISO 8601 time, as that check recorded it. Absent for a web page, which says what it says when it is read, and where the check did not record it." }
    AccessSupportAck:
      type: object
      required: [reference, message, delivery]
      properties:
        reference: { type: string }
