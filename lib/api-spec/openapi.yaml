        "200":
          description: Saved after current release and owner checks; no entitlement is granted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedTemplates" }
        "404": { description: Release unavailable }
        "403": { description: Active owner required }
        "409": { description: Saved-item limit reached }
  /workspace/saved-templates/by-template/{templateId}:
