      operationId: prepareSourceReview
      tags: [staff]
      summary: Ask for the next candidate of a held template or guide from its review work
      description: >-
        A Content editor asks, from an open row on a held template or guide that has a preparer, for its
        next candidate (docs/architecture/source-register.md, slice 4). The worker takes a fresh copy of
