        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SupportCaseAction" }
      responses:
        "200":
          description: Action saved, or the same request replayed without repeating it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffSupportCaseDetail" }
