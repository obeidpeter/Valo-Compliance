            application/json:
              schema: { $ref: "#/components/schemas/ContentEscalationList" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /admin/support-escalations/{id}/action:
    post:
      operationId: actOnContentEscalation
      tags: [staff]
      summary: Acknowledge or close a content referral, or hold the referred version
      description: Closing a referral never approves publication or releases a hold. A hold uses the source control authority and queues reassessment; no AI call or message is sent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContentEscalationActionInput" }
      responses:
        "200":
          description: Triage saved, or the same request replayed without repeating it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentEscalationResult" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/ConflictError" }
        "503": { $ref: "#/components/responses/AuthError" }
