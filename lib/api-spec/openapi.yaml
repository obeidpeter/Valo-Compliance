        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/WriteLimit" }
components:
  responses:
    WriteLimit:
      description: Durable write ceiling reached; saved data is unchanged and unsaved input must be retained
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 }, description: Seconds until the limiting database window resets }
      content:
        application/json:
          schema:
            type: object
            required: [code, error, retryAfter]
            properties:
              code: { type: string, enum: [WRITE_LIMIT_REACHED] }
              error: { type: string }
              retryAfter: { type: integer, minimum: 1 }
    QuotaError:
      description: Read ceiling reached; retry after the indicated seconds without changing saved work
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the current database window resets }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiProblem" }
    ConflictError:
      description: The request version or processing state changed; reload before retrying
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error: { type: string }
              currentRevision: { type: integer }
              requestId: { type: string }
    AuthError:
      description: Validation, access or concurrency error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    PublicSourceReference:
      type: object
      required: [url, title, locator]
      properties:
        url: { type: string }
        title: { type: string }
        locator: { type: string }
    AccessSupportAck:
      type: object
      required: [reference, message, delivery]
      properties:
        reference: { type: string }
        message: { type: string }
        delivery: { type: string, enum: [not_dispatched] }
    CustomerAITask:
      type: string
      enum: [invoice, quotation, payment_reminder, business_proposal]
    FinancialLine:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPriceKobo]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: string, pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,3})?$" }
        unitPriceKobo: { type: string, pattern: "^[0-9]{1,24}$" }
        currency: { type: string, minLength: 3, maxLength: 3 }
    FinancialInput:
      type: object
      additionalProperties: false
      required: [kind, lines, taxAmountKobo, taxLabel, discountKobo, amountDueKobo]
      properties:
        kind: { $ref: "#/components/schemas/CustomerAITask" }
        lines: { type: array, maxItems: 40, items: { $ref: "#/components/schemas/FinancialLine" } }
        taxAmountKobo: { type: [string, "null"], pattern: "^[0-9]{1,24}$" }
        taxLabel: { type: string, maxLength: 80 }
        discountKobo: { type: [string, "null"], pattern: "^[0-9]{1,24}$" }
        deliveryKobo: { type: string, pattern: "^[0-9]{1,24}$" }
        discountPercent: { type: string, pattern: "^(0|[1-9][0-9]{0,2})(\\.[0-9]{1,4})?$" }
        taxPercent: { type: string, pattern: "^(0|[1-9][0-9]{0,2})(\\.[0-9]{1,4})?$" }
        taxBaseKobo: { type: string, pattern: "^[0-9]{1,24}$" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        requestedTotalKobo: { type: string, pattern: "^[0-9]{1,24}$" }
        disputedKobo: { type: string, pattern: "^[0-9]{1,24}$" }
        optionalLines:
          type: array
          maxItems: 40
          items:
            type: object
            additionalProperties: false
            required: [description, quantity, unitPriceKobo, selected]
            properties:
              description: { type: string, minLength: 1, maxLength: 240 }
              quantity: { type: string, pattern: "^(0|[1-9][0-9]{0,6})(\\.[0-9]{1,3})?$" }
              unitPriceKobo: { type: string, pattern: "^[0-9]{1,24}$" }
              selected: { type: boolean }
              currency: { type: string, pattern: "^[A-Z]{3}$" }
        amountDueKobo: { type: [string, "null"], pattern: "^[0-9]{1,24}$" }
        paymentRecord:
          type: object
          additionalProperties: false
          required: [invoiceAmountKobo, payments]
          properties:
            invoiceAmountKobo: { type: string, pattern: "^[0-9]{1,24}$" }
            duplicatesConfirmed: { type: boolean }
            payments:
              type: array
              maxItems: 40
              items:
                type: object
                additionalProperties: false
                required: [reference, amountKobo]
                properties:
                  reference: { type: string, minLength: 1, maxLength: 80 }
                  amountKobo: { type: string, pattern: "^[0-9]{1,24}$" }
    ApiProblem:
      type: object
      required: [error, code, message, requestId]
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        currentRevision: { type: integer }
    Answer:
      type: string
      enum: [yes, no, unknown, unanswered, not_applicable]
    DocumentBlock:
      type: object
      additionalProperties: false
      required: [id, type, text, rows]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [paragraph, list, table] }
        text: { type: string, maxLength: 8000 }
        rows:
          type: array
          maxItems: 100
          items: { type: array, maxItems: 10, items: { type: string, maxLength: 1000 } }
    CanonicalDocument:
      type: object
      additionalProperties: false
      required: [fields, blocks, selectedClauses, formatting]
      properties:
        fields:
          type: object
          additionalProperties: false
          required: [issuerName, recipientName, documentNumber, issueDate, dueDate, notes]
          properties:
            issuerName: { type: string, maxLength: 160 }
            recipientName: { type: string, maxLength: 160 }
            documentNumber: { type: string, maxLength: 80 }
            issueDate: { type: string, maxLength: 10 }
            dueDate: { type: string, maxLength: 10 }
            notes: { type: string, maxLength: 5000 }
        blocks: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/DocumentBlock" } }
        selectedClauses: { type: array, maxItems: 0, items: { type: string } }
        financialInput: { $ref: "#/components/schemas/FinancialInput" }
        formatting:
          type: object
          additionalProperties: false
          required: [font, accent]
          properties:
            font: { type: string, enum: [sans, serif] }
            accent: { type: string, enum: [forest, charcoal] }
    BusinessDocument:
      type: object
      required: [id, revisionId, title, revision, content, contentHash, createdAt, updatedAt, status, templateVersion]
      properties:
        revisionId: { type: string, format: uuid }
        id: { type: string }
        title: { type: string }
        revision: { type: integer }
        content: { $ref: "#/components/schemas/CanonicalDocument" }
        contentHash: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        status: { type: string, enum: [business_draft] }
        templateVersion: { type: ["string", "null"] }
    CustomerAIInput:
      type: object
      additionalProperties: false
      required: [task, tone, issuerName, recipientName, documentNumber, issueDate, dueDate, contextLines, financialInput, processingConsent, idempotencyKey]
      properties:
        task: { $ref: "#/components/schemas/CustomerAITask" }
        tone: { type: string, enum: [neutral, polite, firm] }
        issuerName: { type: string, maxLength: 160 }
        recipientName: { type: string, maxLength: 160 }
        documentNumber: { type: string, maxLength: 80 }
        issueDate: { type: string, pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$" }
        dueDate: { type: string, pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$" }
        contextLines: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 1000 } }
        draftingInstruction: { type: string, maxLength: 1000, description: "Optional untrusted organisation preference; never copied into the business document or used to supply missing business facts." }
        financialInput: { $ref: "#/components/schemas/FinancialInput" }
        processingConsent: { type: boolean }
        idempotencyKey: { type: string, format: uuid }
    CustomerAIPreview:
      type: object
      required: [id, task, status, title, content, missingFields, limitations, modelUsed, providerCalls, inputHash, previewHash, acceptedDocumentId]
      properties:
        id: { type: string }
