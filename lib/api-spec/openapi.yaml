      required: [assignments, changes, notice]
      properties:
        assignments:
          type: array
          items: { $ref: "#/components/schemas/StaffRoleAssignment" }
        changes:
          type: array
          items: { $ref: "#/components/schemas/StaffRoleChangeReceipt" }
        notice: { type: string }
    StaffOperations:
      type: object
      required: [area, notice, records]
      properties:
        area: { type: string, enum: [content, support, finance, system] }
        notice: { type: string }
        records: { type: array, items: { type: object, additionalProperties: true } }
        preparedCandidates:
          description: >-
            Content area only. Template candidates prepared for their two reviews (decision 0014), most
            recent first. A candidate is a private artifact until its reviews are checked, so it is not
            among the content versions.
          type: array
          items: { $ref: "#/components/schemas/StaffPreparedCandidate" }
    StaffPreparedCandidate:
      type: object
      additionalProperties: false
      required: [artifactId, artifactHash, versionId, templateId, version, preparedAt, reviewBy, state, savedStatus]
      properties:
        artifactId: { type: string, format: uuid }
        artifactHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        versionId: { type: string, format: uuid }
        templateId: { type: string }
        version: { type: integer, minimum: 1 }
        preparedAt: { type: string, format: date-time }
        reviewBy: { type: string, format: date-time }
        state:
          description: >-
            awaiting_reviews until its version is saved; saved once it is, with that version's status;
            expired after its review date; version_taken when another candidate was saved under its
            version number first.
          type: string
          enum: [awaiting_reviews, saved, expired, version_taken]
        savedStatus: { type: [string, "null"], enum: [candidate, held, published, withdrawn, null] }
    AccessSupportInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, email, topic, message]
      properties:
        idempotencyKey: { type: string, format: uuid }
        email: { type: string, format: email, maxLength: 254 }
        topic: { type: string, enum: [account_access, general, content_issue] }
        message: { type: string, minLength: 20, maxLength: 2000 }
        website: { type: string, maxLength: 0 }
    TicketInput:
      type: object
      additionalProperties: false
      required: [category, scope, contactEmail, sharingConsent]
      properties:
        category: { type: string, enum: [support, registration, tax, accounting, employment, legal, privacy, sector_approval] }
        scope: { type: string, minLength: 10, maxLength: 4000 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        sharingConsent: { type: boolean }
    TicketReceipt:
      type: object
      required: [reference, message, dispatchStatus]
      properties:
        reference: { type: string }
        message: { type: string }
        dispatchStatus: { type: string, enum: [awaiting_staff] }
    SupportCaseStatus:
      type: string
      enum: [open, in_progress, awaiting_customer, resolved]
    CustomerSupportCaseSummary:
      type: object
      required: [id, sourceKind, reference, category, status, version, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [workspace, access] }
        reference: { type: string }
        category: { type: string }
        status: { $ref: "#/components/schemas/SupportCaseStatus" }
        version: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
    StaffSupportCaseSummary:
      allOf:
        - { $ref: "#/components/schemas/CustomerSupportCaseSummary" }
        - type: object
          required: [assignedTo]
          properties:
            assignedTo: { type: [string, "null"] }
    CustomerSupportCaseList:
      type: object
      required: [cases, page, pageSize, hasMore, notice]
      properties:
        cases: { type: array, items: { $ref: "#/components/schemas/CustomerSupportCaseSummary" } }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
        notice: { type: string }
    StaffSupportCaseList:
      type: object
      required: [cases, page, pageSize, hasMore, notice]
      properties:
        cases: { type: array, items: { $ref: "#/components/schemas/StaffSupportCaseSummary" } }
        page: { type: integer }
        pageSize: { type: integer }
        hasMore: { type: boolean }
        notice: { type: string }
    CustomerSupportCase:
      type: object
      required: [id, sourceKind, reference, category, scope, contactEmail, sharingConsent, status, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceKind: { type: string, enum: [workspace, access] }
        reference: { type: string }
        category: { type: string }
        scope: { type: string }
        contactEmail: { type: string }
        sharingConsent: { type: boolean }
        status: { $ref: "#/components/schemas/SupportCaseStatus" }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    StaffSupportCase:
      allOf:
        - { $ref: "#/components/schemas/CustomerSupportCase" }
        - type: object
          required: [assignedTo]
          properties:
            assignedTo: { type: [string, "null"] }
    SupportMessage:
      type: object
      required: [id, body, createdAt, authorKind, visibility]
      properties:
        id: { type: string, format: uuid }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        authorKind: { type: string, enum: [customer, staff] }
        visibility: { type: string, enum: [customer, internal] }
    SupportEvent:
      type: object
      required: [id, caseId, actorId, action, createdAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        actorId: { type: string }
        action: { type: string }
        createdAt: { type: string, format: date-time }
    SupportCaseEscalation:
      type: object
      required: [id, caseId, targetKind, targetId, targetHash, targetVersion, reason, status, sourceImpactId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
        targetKind: { type: string, enum: [content, rule] }
        targetId: { type: string, format: uuid }
        targetHash: { type: string }
        targetVersion: { type: integer, minimum: 1 }
        reason: { type: string }
        status: { type: string, enum: [queued, acknowledged, resolved] }
        sourceImpactId: { type: [string, "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CustomerSupportCaseDetail:
      type: object
      required: [case, messages, messagesPage, messagePageSize, moreMessages, notice]
      properties:
        case: { $ref: "#/components/schemas/CustomerSupportCase" }
        messages: { type: array, items: { $ref: "#/components/schemas/SupportMessage" } }
        messagesPage: { type: integer }
        messagePageSize: { type: integer }
        moreMessages: { type: boolean }
        notice: { type: string }
    StaffSupportCaseDetail:
      type: object
      required: [case, messages, messagesPage, messagePageSize, moreMessages, events, eventsTruncated, escalations, escalationsTruncated, notice]
      properties:
        case: { $ref: "#/components/schemas/StaffSupportCase" }
        messages: { type: array, items: { $ref: "#/components/schemas/SupportMessage" } }
        messagesPage: { type: integer }
        messagePageSize: { type: integer }
        moreMessages: { type: boolean }
        events: { type: array, items: { $ref: "#/components/schemas/SupportEvent" } }
        eventsTruncated: { type: boolean }
        escalations: { type: array, items: { $ref: "#/components/schemas/SupportCaseEscalation" } }
        escalationsTruncated: { type: boolean }
        notice: { type: string }
    SupportAssignees:
      type: object
      required: [assignees]
      properties:
        assignees:
          type: array
          items:
            type: object
            required: [identityId]
            properties:
              identityId: { type: string }
    SupportReplyInput:
      type: object
      additionalProperties: false
      required: [idempotencyKey, expectedVersion, body]
      properties:
        idempotencyKey: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1 }
        body: { type: string, minLength: 8, maxLength: 4000 }
    SupportCaseAction:
      oneOf:
        - type: object
          additionalProperties: false
          required: [idempotencyKey, expectedVersion, action, assigneeId]
          properties:
            idempotencyKey: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 1 }
            action: { type: string, enum: [assign] }
            assigneeId: { type: string, minLength: 1, maxLength: 200 }
        - type: object
          additionalProperties: false
          required: [idempotencyKey, expectedVersion, action, body]
          properties:
            idempotencyKey: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 1 }
            action: { type: string, enum: [reply, resolve, reopen] }
            body: { type: string, minLength: 8, maxLength: 4000 }
        - type: object
          additionalProperties: false
          required: [idempotencyKey, expectedVersion, action, body, targetKind, targetId]
          properties:
            idempotencyKey: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 1 }
            action: { type: string, enum: [escalate_content] }
            body: { type: string, minLength: 8, maxLength: 4000 }
            targetKind: { type: string, enum: [content, rule] }
            targetId: { type: string, format: uuid }
    ContentEscalation:
      type: object
      required: [id, caseId, reference, targetKind, targetId, targetVersion, targetHash, status, reason, sourceImpactId, caseVersion, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        caseId: { type: string, format: uuid }
