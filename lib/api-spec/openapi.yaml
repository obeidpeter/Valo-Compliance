        title: { type: string }
        revision: { type: integer }
        content: { $ref: "#/components/schemas/CanonicalDocument" }
        contentHash: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        status: { type: string, enum: [business_draft] }
        templateVersion: { type: ["string", "null"] }
    TicketInput:
      type: object
      additionalProperties: false
      required: [category, scope, contactEmail, sharingConsent]
      properties:
        category: { type: string, enum: [support, registration, tax, accounting, employment, legal, privacy, sector_approval] }
        scope: { type: string, minLength: 10, maxLength: 4000 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        sharingConsent: { type: boolean }
    TicketReceipt:
      type: object
      required: [reference, message, dispatchStatus]
      properties:
        reference: { type: string }
        message: { type: string }
        dispatchStatus: { type: string, enum: [awaiting_staff] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

