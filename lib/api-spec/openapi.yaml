          required: [issuerName, recipientName, documentNumber, issueDate, dueDate, notes]
          properties:
            issuerName: { type: string, maxLength: 160 }
            recipientName: { type: string, maxLength: 160 }
            documentNumber: { type: string, maxLength: 80 }
            issueDate: { type: string, maxLength: 10 }
            dueDate: { type: string, maxLength: 10 }
            notes: { type: string, maxLength: 5000 }
        blocks: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/DocumentBlock" } }
        selectedClauses: { type: array, maxItems: 0, items: { type: string } }
