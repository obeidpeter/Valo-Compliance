      description: >-
        The owner confirms the guide they read by its candidate's checksum. Its sources are checked again
        against today's copies, and the check is recorded only if every one holds. A guide's reviews are
        admitted, and the guide released, only within a day of such a check. Nothing is reviewed or
        released here.
