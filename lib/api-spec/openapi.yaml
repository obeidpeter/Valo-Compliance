openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /v1/documents/{id}/exports:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listDocumentExports
      tags: [workspace]
      responses:
        "200":
          description: Authorised saved-revision export jobs; private keys are never returned.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ExportJob" } }
    post:
      operationId: createDocumentExport
      tags: [workspace]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportInput" }
      responses:
        "202":
          description: "Durably recorded export request, or the existing matching job."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "409": { description: Key reused for different content or conflicting operation. }
        "422": { description: Invalid fields or missing deliberate draft acknowledgement. }
  /v1/exports/{id}/retry:
    post:
      operationId: retryDocumentExport
      tags: [workspace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRetryInput" }
      responses:
        "202":
          description: "Retry recorded, or the existing job state."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
  /v1/exports/{id}/file:
    get:
      operationId: downloadDocumentExport
      tags: [workspace]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: "Authorised integrity-checked private file, never publicly cached."
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "404": { description: "Missing, unavailable or unauthorised file." }
  /public/coverage:
    get:
      operationId: getPublicCoverage
      responses:
        "200":
          description: Evidence-held coverage plan, not published regulatory guidance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicCoverage" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /development/source-evidence:
    get:
      operationId: getSourceEvidence
      responses:
        "200":
          description: Development-only original reference leads, actual retrieval state and unapproved policy proposals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceEvidenceRegister"
        "404":
          description: Not available outside development
  /development/proof:
    get:
      operationId: getProofRegister
      responses:
        "200":
          description: Original UAT packs, gates and non-waivable release controls; not acceptance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofRegister" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /development/content:
    get:
      operationId: getContentRegister
      responses:
        "200":
          description: Development-only held content traceability, never approved public content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentRegister" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /development/requirements:
    get:
      operationId: getRequirementsRegister
      responses:
        "200":
          description: Development-only requirements and conflict register, never customer data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementsRegister" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /public/catalogue:
    get:
      operationId: listPublicCatalogue
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: type, schema: { type: string, enum: [all, template, guidance, service] } }
        - { in: query, name: industry, schema: { type: string, maxLength: 80 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: Released public content only
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CataloguePage"
        "429": { $ref: "#/components/responses/QuotaError" }
  /public/status:
    get:
      operationId: getBuildStatus
      responses:
        "200":
          description: Factual development release status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BuildStatus"
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Server resolved owner workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/profile:
    put:
      operationId: saveBusinessProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Versioned business profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
  /workspace/documents:
    get:
      operationId: listDocuments
      responses:
        "200":
          description: Private business drafts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
    post:
      operationId: createDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Saved manual business draft, not a published template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDocument"
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /workspace/documents/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getDocument
      responses:
        "200":
          description: Latest canonical saved revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
    patch:
      operationId: saveDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentUpdate"
      responses:
        "200":
          description: Newly appended immutable revision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessDocument" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
  /workspace/documents/{id}/revisions:
    get:
      operationId: listDocumentRevisions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Immutable historical revisions scoped to the workspace
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BusinessDocument" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/QuotaError" }
  /workspace/support:
    post:
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketInput" }
      responses:
        "201":
          description: Ticket durably saved, no appointment or dispatch claim
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketReceipt" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    QuotaError:
      description: Read ceiling reached; retry after the indicated seconds without changing saved work
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until the current database window resets }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiProblem" }
    AuthError:
      description: Validation, access or concurrency error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiProblem"
  schemas:
    SourceEvidenceRegister:
      type: object
      required: [notice, references, retentionProposals, roadmapSections, coordinatingSummary, handoverSummary, editorialRuns]
      properties:
        editorialRuns:
          type: array
          items: { $ref: "#/components/schemas/EditorialRunEvidence" }
        handoverSummary: { type: string }
        coordinatingSummary: { type: string }
        notice: { type: string }
        references:
          type: array
          items: { $ref: "#/components/schemas/ReferenceEvidence" }
        retentionProposals:
          type: array
          items: { $ref: "#/components/schemas/RetentionProposal" }
        roadmapSections:
          type: array
          items: { $ref: "#/components/schemas/RoadmapContext" }
    EditorialRunEvidence:
      type: object
      required: [id, pipelineId, role, status, model, promptVersion, sourceHash, candidateHash, providerResponseId, latencyMs, inputTokens, outputTokens, createdAt, publication, failureCode, modelVerdict]
      properties:
        id: { type: string }
        pipelineId: { type: string }
        role: { type: string }
        status: { type: string }
        model: { type: string }
        promptVersion: { type: string }
        sourceHash: { type: string }
        candidateHash: { type: ["string", "null"] }
        providerResponseId: { type: ["string", "null"] }
        latencyMs: { type: ["integer", "null"] }
        inputTokens: { type: ["integer", "null"] }
        outputTokens: { type: ["integer", "null"] }
        createdAt: { type: string }
        publication: { type: string, enum: [held] }
        failureCode: { type: ["string", "null"] }
        modelVerdict: { type: ["string", "null"] }
    ReferenceEvidence:
      type: object
      required: [id, title, url, category, baselineNotes, sourceLocator, status, attemptedAt, fetchedAt, httpStatus, failureCode, rawChecksum, textChecksum, rawStored, textStored, publication, aiReviewedAt, sourceCheckedAt, coordinatingNotes, titleEvidenceStatus, metadataTitle, titleWarning]
      properties:
        coordinatingNotes:
          type: array
          items: { type: string }
        titleEvidenceStatus: { type: ["string", "null"] }
        metadataTitle: { type: ["string", "null"] }
        titleWarning: { type: ["string", "null"] }
        id: { type: string }
        title: { type: string }
        url: { type: string, format: uri }
        category: { type: string }
        baselineNotes: { type: string }
        sourceLocator: { type: string }
        status: { type: string }
        attemptedAt: { type: ["string", "null"] }
        fetchedAt: { type: ["string", "null"] }
        httpStatus: { type: ["integer", "null"] }
        failureCode: { type: ["string", "null"] }
        rawChecksum: { type: ["string", "null"] }
        textChecksum: { type: ["string", "null"] }
        rawStored: { type: boolean }
        textStored: { type: boolean }
        publication: { type: string, enum: [held] }
        aiReviewedAt: { type: ["string", "null"] }
        sourceCheckedAt: { type: ["string", "null"] }
    RetentionProposal:
      type: object
      required: [id, dataClass, exactProposal, status, statutoryPeriod, approved, enforced]
      properties:
        id: { type: string }
        dataClass: { type: string }
        exactProposal: { type: string }
        status: { type: string }
        statutoryPeriod: { type: boolean, enum: [false] }
        approved: { type: boolean, enum: [false] }
        enforced: { type: boolean, enum: [false] }
    RoadmapContext:
      type: object
      required: [id, title, exactContract, sha256, status]
      properties:
        id: { type: string }
        title: { type: string }
        exactContract: { type: string }
        sha256: { type: string }
        status: { type: string }
    IndustryCoverage:
      type: object
      required: [id, slug, title, deeperPackTarget, enhancedEvidenceRequired, coverageState, evidenceState, sourceCheckedAt, publishedItems]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        deeperPackTarget: { type: boolean }
        enhancedEvidenceRequired: { type: boolean }
        coverageState: { type: string }
        evidenceState: { type: string }
        sourceCheckedAt: { type: [string, "null"], format: date-time }
        publishedItems: { type: integer }
    PublicCoverage:
      type: object
      required: [industries, guidanceTarget, publishedGuidance, guidesTarget, publishedGuides, deeperPackTarget, publishedDeeperPacks, selectableLocations, priorityLocations, checkedLocationPacks, notice, ngoNotice]
      properties:
        industries: { type: array, items: { $ref: "#/components/schemas/IndustryCoverage" } }
        guidanceTarget: { type: integer }
        publishedGuidance: { type: integer }
        guidesTarget: { type: integer }
        publishedGuides: { type: integer }
        deeperPackTarget: { type: integer }
        publishedDeeperPacks: { type: integer }
        selectableLocations: { type: integer }
        priorityLocations: { type: array, items: { type: string } }
        checkedLocationPacks: { type: integer }
        notice: { type: string }
        ngoNotice: { type: string }
    InventoryOverlap:
      type: object
      required: [id, source_ids, type, note]
      properties:
        id: { type: string }
        source_ids: { type: array, items: { type: string } }
        type: { type: string }
        note: { type: string }
        canonical_id: { type: string }
    CoverageLayer:
      type: object
      required: [id, title, commitment, representation, status]
      properties:
        id: { type: string }
        title: { type: string }
        commitment: { type: string }
        representation: { type: string }
        status: { type: string }
    ExpansionBoundary:
      type: object
      required: [id, release, horizon, priority, condition, enabled, status]
      properties:
        id: { type: string }
        release: { type: string }
        horizon: { type: string }
        priority: { type: string }
        condition: { type: string }
        enabled: { type: boolean }
        status: { type: string }
    ManagementFile:
      type: object
      required: [id, title, description]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
    ExpansionTargets:
      type: object
      required: [templates, guided, guidance, deeperPacks, locationsUpTo]
      properties:
        templates: { type: integer }
        guided: { type: integer }
        guidance: { type: integer }
        deeperPacks: { type: integer }
        locationsUpTo: { type: integer }
    UatPack:
      type: object
      required: [id, title, requirements, requiredEvidence, status, accepted, reason]
      properties:
        id: { type: string }
        title: { type: string }
        requirements: { type: string }
        requiredEvidence: { type: string }
        status: { type: string }
        accepted: { type: boolean }
        reason: { type: string }
    ReleaseGate:
      type: object
      required: [id, phaseId, plannedWindow, requiredEvidence, approvers, status, reason]
      properties:
        id: { type: string }
        phaseId: { type: string }
        plannedWindow: { type: string }
        requiredEvidence: { type: string }
        approvers: { type: string }
        status: { type: string }
        reason: { type: string }
    ReleaseControl:
      type: object
      required: [id, title, source, text]
      properties:
        id: { type: string }
        title: { type: string }
        source: { type: string }
        text: { type: string }
    ProofSuite:
      type: object
      required: [id, requiredCases, executedCases, accepted]
      properties:
        id: { type: string }
        requiredCases: { type: integer }
        executedCases: { type: integer }
        accepted: { type: boolean }
    ProofRegister:
      type: object
      required: [uatPackages, gates, releaseControls, suites, r1Accepted, r2Unlocked, publicLaunchEnabled]
      properties:
        uatPackages: { type: array, items: { $ref: "#/components/schemas/UatPack" } }
        gates: { type: array, items: { $ref: "#/components/schemas/ReleaseGate" } }
        releaseControls: { type: array, items: { $ref: "#/components/schemas/ReleaseControl" } }
        suites: { type: array, items: { $ref: "#/components/schemas/ProofSuite" } }
        r1Accepted: { type: boolean }
        r2Unlocked: { type: boolean }
        publicLaunchEnabled: { type: boolean }
    ContentTraceRow:
      type: object
      required: [id, title, kind, status, relatedIds, limitation, canonicalId, mappingType, evidenceState, coverageState, publicationEligible, sourceLocator, overlapIds, sourceCheckedAt]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string }
        status: { type: string }
        relatedIds: { type: array, items: { type: string } }
        limitation: { type: string }
        canonicalId: { type: [string, "null"] }
        mappingType: { type: string }
        evidenceState: { type: string }
        coverageState: { type: string }
        publicationEligible: { type: boolean }
        sourceLocator: { type: string }
        overlapIds: { type: array, items: { type: string } }
        sourceCheckedAt: { type: [string, "null"], format: date-time }
    ContentRegister:
      type: object
      required: [rows, industries, deeperPacks, identifiedTemplates, regulatoryRows, publishedTemplates, notice, overlaps, coverageLayers, expansionBoundaries, managementFiles, ngoCaution, provisionalTargets, r2Targets]
      properties:
        rows: { type: array, items: { $ref: "#/components/schemas/ContentTraceRow" } }
        industries: { type: array, items: { type: string } }
        deeperPacks: { type: array, items: { type: string } }
        identifiedTemplates: { type: integer }
        regulatoryRows: { type: integer }
        publishedTemplates: { type: integer }
        notice: { type: string }
        overlaps: { type: array, items: { $ref: "#/components/schemas/InventoryOverlap" } }
        coverageLayers: { type: array, items: { $ref: "#/components/schemas/CoverageLayer" } }
        expansionBoundaries: { type: array, items: { $ref: "#/components/schemas/ExpansionBoundary" } }
        managementFiles: { type: array, items: { $ref: "#/components/schemas/ManagementFile" } }
        ngoCaution: { type: string }
        provisionalTargets: { type: string }
        r2Targets: { $ref: "#/components/schemas/ExpansionTargets" }
    RequirementRecord:
      type: object
      required: [id, title, release, priority, exactText, acceptance, status, implementationPaths, blockers]
      properties:
        id: { type: string }
        title: { type: string }
        release: { type: string }
        priority: { type: string }
        exactText: { type: string }
        acceptance: { type: string }
        status: { type: string, enum: [blocked, verified, in_progress, not_started] }
        implementationPaths: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        sourceExactText: { type: string }
        sourceLocator: { type: string }
        owner: { type: string }
        dependencies: { type: array, items: { type: string } }
    ConflictRecord:
      type: object
      required: [id, topic, status, issue, resolution, blocks]
      properties:
        id: { type: string }
        topic: { type: string }
        status: { type: string }
        issue: { type: string }
        resolution: { type: [string, "null"] }
        blocks: { type: array, items: { type: string } }
    RequirementsRegister:
      type: object
      required: [requirements, conflicts]
      properties:
        requirements: { type: array, items: { $ref: "#/components/schemas/RequirementRecord" } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/ConflictRecord" } }
    ApiProblem:
      type: object
      required: [error, code, message, requestId]
      properties:
        error: { type: string }
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
        currentRevision: { type: integer }
    PublicItem:
      type: object
      required: [id, slug, title, type, summary, industry]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        type: { type: string }
        summary: { type: string }
        industry: { type: string }
    CataloguePage:
      type: object
      required: [items, total, page, heldTemplates]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/PublicItem" } }
        total: { type: integer }
        page: { type: integer }
        heldTemplates: { type: integer }
    BuildStatus:
      type: object
      required: [receivedRequirements, expectedRequirements, publishedTemplates, p0Passed, r2Unlocked, livePaymentsEnabled, notice]
      properties:
        receivedRequirements: { type: integer }
        expectedRequirements: { type: integer }
        publishedTemplates: { type: integer }
        p0Passed: { type: boolean }
        r2Unlocked: { type: boolean }
        livePaymentsEnabled: { type: boolean }
        notice: { type: string }
    Profile:
      type: object
      additionalProperties: false
      required: [businessName, legalForm, registrationStatus, activities, state, lga, employees, turnoverBand, turnoverYear, turnoverMetric, turnoverCurrency, premises, manufacturing, importing, personalData, marketingConsent]
      properties:
        businessName: { type: string, minLength: 1, maxLength: 160 }
        legalForm: { type: string, enum: [unknown, sole_proprietor, partnership, limited_company, incorporated_trustees, company_limited_by_guarantee] }
        registrationStatus: { type: string, enum: [unknown, registered, unregistered, pending] }
        activities: { type: array, minItems: 1, maxItems: 10, items: { type: string, minLength: 1, maxLength: 120 } }
        state: { type: string, maxLength: 60 }
        lga: { type: string, maxLength: 100 }
        employees: { type: string, pattern: "^(unknown|unanswered|not_applicable|[0-9]{1,7})$" }
        turnoverBand: { type: string, enum: [unknown, unanswered, not_applicable, under_5m, 5m_to_25m, 25m_to_100m, over_100m] }
        turnoverYear: { type: string, pattern: "^(unknown|[0-9]{4})$" }
        turnoverMetric: { type: string, enum: [unknown, gross_revenue] }
        turnoverCurrency: { type: string, enum: [unknown, NGN] }
        premises: { $ref: "#/components/schemas/Answer" }
        manufacturing: { $ref: "#/components/schemas/Answer" }
        importing: { $ref: "#/components/schemas/Answer" }
        personalData: { $ref: "#/components/schemas/Answer" }
        marketingConsent: { type: boolean }
    Answer:
      type: string
      enum: [yes, no, unknown, unanswered, not_applicable]
    ProfileInput:
      type: object
      additionalProperties: false
      required: [expectedRevision, profile]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        profile: { $ref: "#/components/schemas/Profile" }
    Workspace:
      type: object
      required: [id, profileRevision, profile, documentCount]
      properties:
        id: { type: string }
        profileRevision: { type: integer }
        profile:
          oneOf:
            - { $ref: "#/components/schemas/Profile" }
            - { type: "null" }
        documentCount: { type: integer }
    ExportInput:
      type: object
      additionalProperties: false
      required: [revisionId, format, acknowledgeDraft]
      properties:
        revisionId: { type: string, format: uuid }
        format: { type: string, enum: [docx, pdf] }
        acknowledgeDraft: { type: boolean }
    ExportRetryInput: { type: object, additionalProperties: false }
    ExportJob:
      type: object
      additionalProperties: false
      required: [id, documentId, revisionId, revision, format, renderVersion, sourceHash, status, attempts, errorCode, checksum, size, downloadUrl, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        revisionId: { type: string, format: uuid }
        revision: { type: integer }
        format: { type: string, enum: [docx, pdf] }
        renderVersion: { type: string }
        sourceHash: { type: string }
        status: { type: string, enum: [queued, running, retrying, ready, failed] }
        attempts: { type: integer }
        errorCode: { type: [string, "null"] }
        checksum: { type: [string, "null"] }
        size: { type: [integer, "null"] }
        downloadUrl: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DocumentBlock:
      type: object
      additionalProperties: false
      required: [id, type, text, rows]
      properties:
        id: { type: string, minLength: 1, maxLength: 80 }
        type: { type: string, enum: [paragraph, list, table] }
        text: { type: string, maxLength: 8000 }
        rows:
          type: array
          maxItems: 100
          items: { type: array, maxItems: 10, items: { type: string, maxLength: 1000 } }
    CanonicalDocument:
      type: object
      additionalProperties: false
      required: [fields, blocks, selectedClauses, formatting]
      properties:
        fields:
          type: object
          additionalProperties: false
          required: [issuerName, recipientName, documentNumber, issueDate, dueDate, notes]
          properties:
            issuerName: { type: string, maxLength: 160 }
            recipientName: { type: string, maxLength: 160 }
            documentNumber: { type: string, maxLength: 80 }
            issueDate: { type: string, maxLength: 10 }
            dueDate: { type: string, maxLength: 10 }
            notes: { type: string, maxLength: 5000 }
        blocks: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/DocumentBlock" } }
        selectedClauses: { type: array, maxItems: 0, items: { type: string } }
        formatting:
          type: object
          additionalProperties: false
          required: [font, accent]
          properties:
            font: { type: string, enum: [sans, serif] }
            accent: { type: string, enum: [forest, charcoal] }
    DocumentInput:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        content: { $ref: "#/components/schemas/CanonicalDocument" }
    DocumentUpdate:
      type: object
      additionalProperties: false
      required: [expectedRevision, title, content]
      properties:
        expectedRevision: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 160 }
        content: { $ref: "#/components/schemas/CanonicalDocument" }
    BusinessDocument:
      type: object
      required: [id, revisionId, title, revision, content, contentHash, createdAt, updatedAt, status, templateVersion]
      properties:
        revisionId: { type: string, format: uuid }
        id: { type: string }
        title: { type: string }
        revision: { type: integer }
        content: { $ref: "#/components/schemas/CanonicalDocument" }
        contentHash: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
        status: { type: string, enum: [business_draft] }
        templateVersion: { type: ["string", "null"] }
    TicketInput:
      type: object
      additionalProperties: false
      required: [category, scope, contactEmail, sharingConsent]
      properties:
        category: { type: string, enum: [support, registration, tax, accounting, employment, legal, privacy, sector_approval] }
        scope: { type: string, minLength: 10, maxLength: 4000 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        sharingConsent: { type: boolean }
    TicketReceipt:
      type: object
      required: [reference, message, dispatchStatus]
      properties:
        reference: { type: string }
        message: { type: string }
        dispatchStatus: { type: string, enum: [awaiting_staff] }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

