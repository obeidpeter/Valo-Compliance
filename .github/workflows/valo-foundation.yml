name: Valo foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/valo-*"]

permissions:
  contents: read

concurrency:
  group: valo-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-security:
    name: Dependency and redacted secret checks on actual merges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Install pinned open-source secret scanner
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.26.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies and run detector canaries and scans
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/scripts exec tsx src/valo/merge-security.ts
      - name: Retain sanitized reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redacted-merge-security
          path: generated-artifacts/valo-security/merge-security.json
  merge-static:
    name: Static security checks with detector canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned open-source local scanner
        run: python -m pip install semgrep==1.179.0
      - name: Run canary and static security rules without cloud upload
        run: bash scripts/src/valo/merge-static.sh
      - name: Retain sanitized static scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redacted-merge-static-security
          path: generated-artifacts/valo-security/merge-static.json
  foundation:
    name: Foundation typecheck and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The handover test verifies the original specification commit is an ancestor.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all source
        run: pnpm run typecheck
      - name: Run foundation unit tests
        run: pnpm --filter @workspace/scripts test:valo
      - name: Install standard PDF readers
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install the locked Playwright Chromium
        run: |
          pnpm --filter @workspace/api-server exec playwright install --with-deps chromium
          echo "CHROMIUM_EXECUTABLE_PATH=$(pnpm --filter @workspace/api-server exec node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run API input-safety tests
        run: pnpm --filter @workspace/api-server test:valo
      - name: Reject unsafe export modes and stale account requests
        run: pnpm --filter @workspace/api-server test:valo-runtime-boundaries
      - name: Check HTTP log privacy, internal alerts and recovery effects
        run: pnpm --filter @workspace/api-server test:valo-operations
      - name: Install local-only recovery tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Restore disposable synthetic database and fixture objects
        run: pnpm --filter @workspace/api-server test:valo-isolated-recovery
      - name: Retain isolated recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-development-recovery
          path: artifacts/api-server/generated-artifacts/valo-recovery/isolated-recovery.json
      - name: Prove isolated source-candidate controls, not legal acceptance
        run: pnpm --filter @workspace/api-server test:valo-source-candidates
      - name: Prove refund reference and timeout contract without a merchant
        run: pnpm --filter @workspace/api-server test:valo-refund-provider
      - name: Build the Next.js application
        run: pnpm --filter @workspace/valo run build
      - name: Prove controlled profile and checker state does not cross accounts
        run: NODE_ENV=development VALO_RUN_ACCOUNT_SCOPE_BROWSER=synthetic-development-only pnpm --filter @workspace/api-server exec tsx src/scripts/account-switch-browser.ts
      - name: Print factual readiness
        run: pnpm --filter @workspace/scripts valo:readiness
  postgres:
    name: Synthetic PostgreSQL isolation and concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valo_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: valo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral synthetic CI service only; no workspace/provider/production secret.
      DATABASE_URL: postgresql://valo_ci:synthetic_ci_only@localhost:5432/valo_ci
      VALO_RUN_DB_TESTS: synthetic-development-only
      SESSION_SECRET: synthetic-ci-only-write-quota-key-not-a-production-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply tracked migrations to empty synthetic database
        run: pnpm --filter @workspace/db exec drizzle-kit migrate --config ./drizzle.config.ts
      - name: Prove tenant boundaries, conflicts and history
        run: pnpm --filter @workspace/api-server test:valo-db
      - name: Prove durable write limits and membership revocation races
        run: pnpm --filter @workspace/api-server test:valo-write-security
      - name: Prove controlled payment settlement and refund lifecycle
        run: |
          pnpm --filter @workspace/api-server test:valo-commerce
          pnpm --filter @workspace/api-server test:valo-refunds
