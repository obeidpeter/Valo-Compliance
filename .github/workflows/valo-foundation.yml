name: Valo foundation CI

on:
  pull_request:
    branches: [main, "feature/valo-p0-foundation"]
  push:
    branches: [main, "feature/valo-*", "claude/**"]

permissions:
  contents: read

concurrency:
  group: valo-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-security:
    name: Dependency and redacted secret checks on actual merges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.24"
      - name: Install pinned open-source secret scanner
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.26.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install frozen dependencies and run detector canaries and scans
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/scripts exec tsx src/valo/merge-security.ts
      - name: Retain sanitized reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redacted-merge-security
          path: generated-artifacts/valo-security/merge-security.json
  merge-static:
    name: Static security checks with detector canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned open-source local scanner
        run: python -m pip install semgrep==1.179.0
      - name: Run canary and static security rules without cloud upload
        run: bash scripts/src/valo/merge-static.sh
      - name: Retain sanitized static scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redacted-merge-static-security
          path: generated-artifacts/valo-security/merge-static.json
  foundation:
    name: Foundation typecheck and unit tests
    # PostgreSQL 16 recovery tooling is part of the supported CI target.
    # ubuntu-latest advanced to 26.04, which no longer supplies that package.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The handover test verifies the original specification commit is an ancestor.
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Record how each test ends, for the requirement evidence register
        run: |
          mkdir -p "$PWD/generated-artifacts/test-results/foundation"
          echo "VALO_TEST_RESULTS_DIR=$PWD/generated-artifacts/test-results/foundation" >> "$GITHUB_ENV"
          echo "NODE_OPTIONS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=$PWD/scripts/src/valo/test-results-reporter.mjs --test-reporter-destination=$PWD/generated-artifacts/test-results/foundation/reporter-output.txt" >> "$GITHUB_ENV"
      - name: Typecheck all source
        run: pnpm run typecheck
      - name: Check formatting, lint rules and repository rules
        run: pnpm run lint
      - name: Check the generated API client matches the contract
        run: |
          pnpm --filter @workspace/api-spec run codegen
          git diff --exit-code -- lib/api-zod lib/api-client-react
      - name: Check the database schema matches its migrations and the guarded push
        run: |
          pnpm --filter @workspace/db test:schema-drift
          pnpm --filter @workspace/db test:schema-guard
      - name: Reject first-factor-only staff sessions and untrusted proxy chains
        run: pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/valo-managed-session.test.ts src/lib/valo-proxy-boundary.test.ts src/middlewares/clerkProxyMiddleware.test.ts ../valo/src/lib/content-security-policy.test.ts
      - name: Prove bounded native workspace storage and versioned UI helpers
        run: pnpm --filter @workspace/api-server test:valo-workspace-export-controls
      - name: Prove unit imports and disabled inference need no database or native storage
        run: pnpm --filter @workspace/api-server exec tsx --test src/lib/inference-no-database.test.ts
      - name: Prove workspace download release requires the current session
        run: pnpm --filter @workspace/api-server test:valo-workspace-download
      - name: Prove finite inference scope, actual callers and disabled entry without network
        run: pnpm --filter @workspace/api-server test:valo-finite-entry
      - name: Prove read-only inference capacity and historical-exposure inspection
        run: pnpm --filter @workspace/api-server test:valo-budget-inspection
      - name: Prove original lifecycle admission and final publication expiry/scope checks
        run: pnpm --filter @workspace/api-server test:valo-editorial-lifecycle
      - name: Prove exact editorial baselines and current-run denial evidence
        run: pnpm --filter @workspace/api-server test:valo-editorial-provenance
      - name: Prove rich checker contracts, factual states and UI helper targets
        run: pnpm --filter @workspace/api-server test:valo-rich-checker
      - name: Prove signed erasure inventory and isolated lock controls
        run: pnpm --filter @workspace/api-server test:valo-erasure-controls
      - name: Prove portable storage bytes and fail-closed native proof selection
        run: pnpm --filter @workspace/api-server test:valo-erasure-storage
      - name: Prove native test namespace guards without native credentials
        run: pnpm --filter @workspace/api-server exec node --experimental-test-module-mocks --test src/test-support/native-proof-namespace.test.mjs
      - name: Run foundation unit tests
        run: pnpm --filter @workspace/scripts test:valo
      - name: Install standard PDF readers
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Install the locked Playwright Chromium
        run: |
          pnpm --filter @workspace/api-server exec playwright install --with-deps chromium
          echo "CHROMIUM_EXECUTABLE_PATH=$(pnpm --filter @workspace/api-server exec node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Run API input-safety tests
        run: pnpm --filter @workspace/api-server test:valo
      - name: Prove template downloads read storage outside the source-state lock
        run: pnpm --filter @workspace/api-server test:valo-released-content
      - name: Prove catalogue filters and saved-item journeys
        run: pnpm --filter @workspace/api-server test:valo-catalogue-browser
      - name: Prove additional source freshness and strict staff command boundaries
        run: pnpm --filter @workspace/api-server test:valo-source-controls
      - name: Prove native workspace download, cancellation and account boundaries
        run: pnpm --filter @workspace/api-server test:valo-workspace-download-browser
      - name: Retain controlled workspace download browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-workspace-download-browser
          path: generated-artifacts/valo-completion/workspace-export-jobs-*
      - name: Reject unsafe export modes and stale account requests
        run: pnpm --filter @workspace/api-server test:valo-runtime-boundaries
      - name: Prove the generated web client keeps every identifier inside its path segment
        run: pnpm --filter @workspace/api-server test:valo-client-paths
      - name: Prove scratch replay cursors preserve tenant and legacy scope
        run: pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/valo-erasure-replay-cursor.test.ts
      - name: Check HTTP log privacy, internal alerts and recovery effects
        run: pnpm --filter @workspace/api-server test:valo-operations
      - name: Prove production storage isolation and worker readiness failures
        run: pnpm --filter @workspace/api-server test:valo-production-readiness
      - name: Build and exercise the shipped worker and operator commands
        run: |
          pnpm --filter @workspace/api-server run build
          pnpm --filter @workspace/api-server test:valo-deployment-artifacts
      - name: Install local-only recovery tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 restic
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Reject stale recovery controls, unsafe archives and false backup success
        run: |
          node --test scripts/ops/recovery_contract.test.mjs scripts/ops/export_retention_contract.test.mjs
          VALO_REQUIRE_REAL_RESTIC=1 python3 -m unittest discover -s scripts/ops -p 'test_*.py'
          systemd-analyze verify scripts/ops/systemd/*.service scripts/ops/systemd/*.timer
      - name: Restore old export deadlines with authenticated current controls
        run: python3 scripts/ops/retention_recovery_drill.py
      - name: Retain isolated retention recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-retention-recovery
          path: generated-artifacts/valo-retention-recovery/report.json
      - name: Activate real production-mode API and worker against an isolated empty database
        run: pnpm --filter @workspace/api-server test:valo-production-rehearsal
      - name: Restore disposable synthetic database and fixture objects
        run: pnpm --filter @workspace/api-server test:valo-isolated-recovery
      - name: Validate phase 2 migrations, applied phase 1 bytes and existing staff preservation
        run: VALO_RUN_MIGRATION_TESTS=synthetic-isolated-only pnpm --filter @workspace/db test:phase1-migrations
      - name: Retain isolated recovery report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-development-recovery
          path: artifacts/api-server/generated-artifacts/valo-recovery/isolated-recovery.json
      - name: Prove isolated source-candidate controls, not legal acceptance
        run: pnpm --filter @workspace/api-server test:valo-source-candidates
      - name: Prove editorial pipeline contracts, source controls and review clarifications
        run: |
          pnpm --filter @workspace/api-server test:valo-editorial
          pnpm --filter @workspace/api-server test:valo-sources
          pnpm --filter @workspace/api-server test:valo-source-challenges
      - name: Prove the web app shell renders deterministically without browser state
        run: pnpm --filter @workspace/api-server test:valo-web
      - name: Prove refund reference and timeout contract without a merchant
        run: pnpm --filter @workspace/api-server test:valo-refund-provider
      - name: Build the Next.js application
        run: pnpm --filter @workspace/valo run build
      - name: Prove compiled frontend enforces unique nonces and blocks injected scripts
        run: pnpm --filter @workspace/api-server exec tsx src/scripts/frontend-security-browser.ts
      - name: Retain compiled frontend security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compiled-frontend-security
          path: generated-artifacts/valo-completion/frontend-security-browser.json
      - name: Prove controlled profile and checker state does not cross accounts
        run: NODE_ENV=development VALO_RUN_ACCOUNT_SCOPE_BROWSER=synthetic-development-only pnpm --filter @workspace/api-server exec tsx src/scripts/account-switch-browser.ts
      - name: Prove staff role confirmation, stable retry and private account boundary
        run: pnpm --filter @workspace/api-server test:valo-staff-role-browser
      - name: Retain controlled staff role browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-staff-role-browser
          path: generated-artifacts/valo-completion/staff-role-browser.*
      - name: Prove native dispute workflow and payment concerns in a controlled browser
        run: pnpm --filter @workspace/api-server test:valo-dispute-browser
      - name: Retain controlled dispute browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-dispute-workflow-browser
          path: generated-artifacts/valo-completion/dispute-*
      - name: Prove protected support transport and private conversation rendering
        run: pnpm --filter @workspace/api-server test:valo-support-ui
      - name: Exercise actual support components with controlled local responses
        run: |
          mkdir -p generated-artifacts/valo-support
          VALO_SUPPORT_BROWSER_EVIDENCE_PATH="$PWD/generated-artifacts/valo-support/browser.json" pnpm --filter @workspace/api-server test:valo-support-browser
      - name: Retain controlled support browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: controlled-support-browser
          path: generated-artifacts/valo-support/browser.json
      - name: Print factual readiness
        run: pnpm --filter @workspace/scripts valo:readiness
      - name: Check every test the evidence register cites for this job passed
        run: pnpm --filter @workspace/scripts valo:ci-evidence --job foundation
      - name: Retain this job's test results for the evidence job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-foundation
          path: generated-artifacts/test-results/foundation
          if-no-files-found: ignore
  postgres:
    name: Synthetic PostgreSQL isolation and concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: valo_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: valo_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U valo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Ephemeral synthetic CI service only; no workspace/provider/production secret.
      DATABASE_URL: postgresql://valo_ci:synthetic_ci_only@localhost:5432/valo_ci
      VALO_RUN_DB_TESTS: synthetic-development-only
      # Never attach native App Storage credentials to this disposable runner.
      VALO_ERASURE_STORAGE_PROOF: portable
      SESSION_SECRET: synthetic-ci-only-write-quota-key-not-a-production-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Record how each test ends, for the requirement evidence register
        run: |
          mkdir -p "$PWD/generated-artifacts/test-results/postgres"
          echo "VALO_TEST_RESULTS_DIR=$PWD/generated-artifacts/test-results/postgres" >> "$GITHUB_ENV"
          echo "NODE_OPTIONS=--test-reporter=spec --test-reporter-destination=stdout --test-reporter=$PWD/scripts/src/valo/test-results-reporter.mjs --test-reporter-destination=$PWD/generated-artifacts/test-results/postgres/reporter-output.txt" >> "$GITHUB_ENV"
      - name: Apply tracked migrations to empty synthetic database
        run: pnpm --filter @workspace/db exec drizzle-kit migrate --config ./drizzle.config.ts
      - name: Let customer requests connect as the workspace login, and check nothing widens it
        env:
          # Ephemeral synthetic CI service only; not a production secret.
          VALO_WORKSPACE_LOGIN_PASSWORD: synthetic_ci_only_workspace_login
        run: |
          url=$(node lib/db/scripts/workspace-login.mjs --print-url)
          echo "VALO_CUSTOMER_DATABASE_URL=$url" >> "$GITHUB_ENV"
          node lib/db/scripts/workspace-row-security.mjs
      - name: Record pooled connections taken inside transactions in every later step
        run: |
          echo "NODE_OPTIONS=$NODE_OPTIONS --import $PWD/artifacts/api-server/src/test-support/nested-connection-preload.mjs" >> "$GITHUB_ENV"
          echo "VALO_NESTED_REPORT_DIR=$PWD/generated-artifacts/nested-connections" >> "$GITHUB_ENV"
      - name: Prove audited staff changes, last-admin concurrency and post-lock emergency expiry
        run: pnpm --filter @workspace/api-server test:valo-staff-roles
      - name: Install reviewed durable queue before payload and erasure tests
        run: NODE_ENV=development VALO_DEV_QUEUE_MIGRATION=reviewed-synthetic-development pnpm --filter @workspace/api-server exec tsx src/scripts/queue-migration.ts apply-development
      - name: Prove real worker readiness, supervised crash restart, parent loss and drain
        run: NODE_ENV=development pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/valo-worker-readiness.integration.test.ts
        env:
          PRIVATE_OBJECT_DIR: ""
          DEFAULT_OBJECT_STORAGE_BUCKET_ID: ""
          PUBLIC_OBJECT_SEARCH_PATHS: ""
      - name: Prove dispute HTTP and transport controls without merchant calls
        run: pnpm --filter @workspace/api-server test:valo-disputes
      - name: Prove canonical background exports, restart, holds and final byte release
        run: pnpm --filter @workspace/api-server test:valo-workspace-export-convergence-db
      - name: Prove cleanup retry fairness, privacy holds and outage recovery
        run: NODE_ENV=development pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/valo-workspace-cleanup.integration.test.ts
      - name: Prove export retention, hold safety, regeneration and final-byte expiry
        run: NODE_ENV=development pnpm --filter @workspace/api-server exec node --experimental-test-module-mocks --import tsx --test src/lib/valo-export-retention.integration.test.ts
      - name: Prove read-only legacy retention inventory, privacy exclusions and proposal drift
        run: NODE_ENV=development pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/valo-export-retention-inventory.integration.test.ts
      - name: Prove dispute immutability and authenticated privacy-copy redaction coexist
        run: VALO_RUN_DB_TESTS=synthetic-development-only NODE_ENV=development pnpm --filter @workspace/api-server exec node --import tsx --test src/lib/valo-private-copy-inventory.integration.test.ts
      - name: Prove paged workspace attachment, final authorization and disconnect cleanup
        run: pnpm --filter @workspace/api-server test:valo-workspace-download-db
      - name: Prove saved-template ownership, concurrency and withdrawal
        run: pnpm --filter @workspace/api-server test:valo-saved-templates
      - name: Prove durable source corrections, staff authority and dispatch races
        run: pnpm --filter @workspace/api-server test:valo-source-controls-db
      - name: Prove concrete editorial reviewer denial, retained snapshots and isolated lifecycle copies
        run: pnpm --filter @workspace/api-server test:valo-editorial-lifecycle-db
      - name: Prove current-rule task guards against synthetic PostgreSQL
        run: pnpm --filter @workspace/api-server test:valo-task-source-guard
      - name: Prove rich checker HTTP preview, consent, history and tenant boundaries
        run: pnpm --filter @workspace/api-server test:valo-checker-http-db
      - name: Prove another workspace's identifiers are refused like unknown ones on every private route (SEC-001)
        run: pnpm --filter @workspace/api-server test:valo-tenant-substitution
      - name: Prove row-level security keeps customer requests inside their own workspace
        run: pnpm --filter @workspace/api-server test:valo-row-security
      - name: Prove premium template files need the workspace's own active purchase
        run: pnpm --filter @workspace/api-server test:valo-template-entitlement
      - name: Prove synthetic erasure holds, late-upload races and bounded recovery
        run: pnpm --filter @workspace/api-server test:valo-erasure-portable-db
        env:
          PRIVATE_OBJECT_DIR: ""
          DEFAULT_OBJECT_STORAGE_BUCKET_ID: ""
          PUBLIC_OBJECT_SEARCH_PATHS: ""
      - name: Install Chromium and independent PDF reader before actual render proofs
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pnpm --filter @workspace/api-server exec playwright install --with-deps chromium
          echo "CHROMIUM_EXECUTABLE_PATH=$(pnpm --filter @workspace/api-server exec node --input-type=module -e 'import {chromium} from "playwright"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Prove tenant boundaries, conflicts and history
        run: pnpm --filter @workspace/api-server test:valo-db-core
      - name: Prove actual HTTP privacy-role and session boundary
        if: ${{ !cancelled() }}
        run: pnpm --filter @workspace/api-server test:valo-privacy-http-db
      - name: Prove original customer fault, quota and tenant service controls without a provider
        run: pnpm --filter @workspace/api-server test:valo-customer-controls-db
      - name: Prove durable dispute intents against synthetic orders and controlled transport
        run: pnpm --filter @workspace/api-server test:valo-disputes-db
      - name: Prove durable support workflow and content-role boundaries
        run: pnpm --filter @workspace/api-server test:valo-support-db
      - name: Prove durable write limits and membership revocation races
        run: pnpm --filter @workspace/api-server test:valo-write-security
      - name: Prove export crash recovery with shared portable private files and real worker processes
        run: pnpm --filter @workspace/api-server test:valo-export-worker-portable-db
      - name: Prove controlled payment settlement and refund lifecycle
        run: |
          pnpm --filter @workspace/api-server test:valo-commerce
          pnpm --filter @workspace/api-server test:valo-refunds
      - name: Check that no transaction took a second pooled connection
        run: node artifacts/api-server/src/test-support/nested-connection-report.mjs
      - name: Check every test the evidence register cites for this job passed
        run: pnpm --filter @workspace/scripts valo:ci-evidence --job postgres
      - name: Retain nested-connection records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nested-connection-records
          path: generated-artifacts/nested-connections
          if-no-files-found: ignore
      - name: Retain this job's test results for the evidence job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-postgres
          path: generated-artifacts/test-results/postgres
          if-no-files-found: ignore
  container-images:
    name: Container images build and start safely
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the API and web images and prove PDF rendering, refusal without configuration and web headers
        run: scripts/ops/check-container-images.sh
  evidence:
    name: Requirement evidence from this run
    needs: [foundation, postgres]
    # Runs after a failed job too, so the report shows which cited tests did not pass.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Set up pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Collect the test results each job recorded
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: test-results-*
          path: generated-artifacts/test-results
      - name: Write the readiness report with this run's requirement evidence
        run: |
          mkdir -p generated-artifacts/readiness
          VALO_EVIDENCE_RESULTS_DIR="$PWD/generated-artifacts/test-results" pnpm --filter @workspace/scripts exec tsx src/valo/readiness.ts > generated-artifacts/readiness/readiness.json
      - name: Check every cited test passed in this run
        run: VALO_EVIDENCE_RESULTS_DIR="$PWD/generated-artifacts/test-results" pnpm --filter @workspace/scripts valo:ci-evidence --all
      - name: Retain the readiness report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: readiness-report
          path: generated-artifacts/readiness/readiness.json
          if-no-files-found: ignore
